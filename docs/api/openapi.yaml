        Aceita `multipart/form-data` (com `attachment`) ou JSON. `body`: trim e corte silencioso a 4000 car.; exige texto OU anexo (422). Texto guardado cru (sem sanitização no servidor). Anexo (opcional): campo multipart `attachment`, PDF ou imagem PNG/JPEG/WEBP/GIF (SVG e HEIC rejeitados), máx. 10 MB (config/upload.js:34-47). O Content-Type declarado é conferido contra os bytes reais (utils/fileSignature.js) em storageService.saveFile. ATENÇÃO: o ficheiro é gravado no armazenamento ANTES de o serviço verificar o acesso ao ticket/conversa (ver Achados). Só participantes (senão 404); conversa FECHADA → 409 CONFLICT "Esta conversa está fechada." (nenhum endpoint do backend fecha conversas).
        Efeitos, por ordem: (1) cria `ConversationMessage` com `senderId`/`senderCompanyId`; (2) actualiza `Conversation.updatedAt`; (3) Socket.IO `conversation:message` (mensagem) na sala `conversation:<id>`; (4) notificação in-app `CHAT_COMERCIAL_MENSAGEM` a TODOS os utilizadores activos da empresa contraparte (personas COMPRADOR, COMPANY_ADMIN, FORNECEDOR, FINANCEIRO) — uma notificação por utilizador por mensagem; (5) Trust & Safety: `riskAnalysisService.analisar(body)` pontua sinais (telefone angolano 2, email 2, app de mensagens 2, pagamento fora 4, cancelar-para-continuar-fora 5, negócio à parte 5); níveis LOW<4, MEDIUM>=4, HIGH>=7, CRITICAL>=11, e sobe um nível (escalada) se já houver alerta ABERTO/EM_ANALISE MEDIUM+ na conversa e score>=4. LOW não é persistido; MEDIUM+ cria `RiskAlert` (ABERTO), auditoria `ALERTA_SEGURANCA_CRIADO` e emite `conversation:risk-alert {level}` à sala da conversa (ou seja, também ao remetente). NUNCA bloqueia a mensagem. O anexo e o seu nome não são analisados. Se os passos 2–5 falharem a mensagem já está gravada (a resposta seria 500 e um reenvio duplica-a).

        Código: backend/src/routes/conversationRoutes.js:42 → conversationService.enviarMensagem (conversationService.js:149) e analisarRisco (:178); riskAnalysisService.js:86.
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - name: id
