  /api/category-management/analise:
    get:
      operationId: categoriasAnalise
      tags:
      - Category Management
      summary: Análise de compras por categoria e economia de escala (plano PRO)
      description: |
        Calcula, para a empresa compradora da sessão, o volume de compra reconhecida por categoria na janela pedida, o patamar de desconto actual, o próximo patamar, quanto falta, a poupança potencial, as oportunidades de consolidação e (opcionalmente) uma recomendação em texto gerada por IA.

        Regras de negócio:
        - Funcionalidade do plano **PRO** (`categoryManagement`, `planService.js:204,223,246`): `assertFeature` → 400 `PLANO_INSUFICIENTE` se o plano não a inclui ou a subscrição está RESTRITA.
        - Volume: soma de `lineTotal` das linhas de POs da empresa (`buyerCompanyId` da sessão) em `PAGA, EM_EXECUCAO, ENTREGUE, RECEBIDA_CONFORME, RECEBIDA_COM_DIVERGENCIA, CONCLUIDA` na janela `[agora − meses, agora]`. **Não há conversão cambial**: o valor é devolvido como `volumeAtualUsd` e comparado com patamares em USD, mas as POs têm moeda `AOA` por omissão (`schema.prisma:915`) — ver achados.
        - `meses`: `Number(meses) || 12`; sem limite superior nem validação (um valor muito grande produz data inválida e erro 500; negativo dá janela vazia).
        - Patamares: apenas `discountThreshold` com `ativo = true`, comuns a todas as empresas.
        - Oportunidade de consolidação: categoria com ≥ 3 POs cujo volume está a uma distância do próximo patamar ≤ ao valor médio por PO.
        - Recomendação por IA: gerada por defeito com chamada à API da Anthropic (`ANTHROPIC_API_KEY`); envia o nome da empresa e agregados de compras (categorias, volumes, oportunidades) para o serviço externo. Passar `recomendacao=0` desactiva a chamada. Sem chave ou em falha, devolve `recomendacao.texto = null` com `motivo` (nunca erro).
        - Isolamento entre empresas: filtra por `req.user.companyId`; os patamares são configuração global.
        - Os `findMany` de linhas de PO não têm `take`, logo ficam cortados a 1000 linhas (`config/database.js:29,42-45`): acima disso volume e oportunidades ficam subavaliados.
        - Só leitura, sem auditoria.

        Código: backend/src/routes/categoryManagementRoutes.js:22 → backend/src/services/categoryAnalyticsService.js:24,142; discountThresholdService.js:82; aiRecommendationService.js:62
