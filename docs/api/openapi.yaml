  /api/assinatura/{id}/confirmar:
    post:
      operationId: assinaturaConfirmar
      tags:
      - Subscrição
      summary: A KIXIMA confirma o pagamento de uma subscrição e o plano muda
      description: |
        Passo central do fluxo: é aqui (e só aqui, a par da confirmação automática por webhook de gateway) que
        o plano da empresa muda. Quem confirma é um utilizador `ADMIN_SISTEMA` com a área `financeiro` (ou Super Admin);
        a empresa nunca confirma o seu próprio pagamento.

        Pré-condições verificadas no service, por esta ordem: a cobrança existe (404); não está `CONFIRMADA` (409
        "já foi confirmada"); não está `CANCELADA` (409); tem `comprovativoUrl` (400 `BUSINESS_RULE_VIOLATION`:
        confirmar sem comprovativo é recusado). NOTA: aceita confirmar uma cobrança em `PENDENTE` desde que já tenha
        comprovativo (não é possível por via normal; só `COMPROVATIVO_ENVIADO` tem comprovativo).

        Efeitos, numa única transacção Prisma: (1) cobrança -> `CONFIRMADA`, `confirmadaEm=now`, `validoAte`,
        `confirmadaPor=<id do admin>`, `notas` (se enviadas); (2) `Company.plan = planoNovo`, `searchRank` derivado do
        plano, `planoValidoAte = validoAte` e `ultimoAvisoSubscricaoTier = null` (reinicia os avisos de expiração);
        (3) auditoria `SUBSCRICAO_CONFIRMADA` dentro da transacção. Depois da transacção: notificação
        `SUBSCRICAO_CONFIRMADA` (in-app/e-mail) a todos os `COMPANY_ADMIN` e `FINANCEIRO` activos da empresa
        (falha de notificação é ignorada).

        Cálculo de `validoAte`: parte do fim da subscrição actual se ainda estiver em vigor (não se perdem dias já pagos),
        senão de hoje; soma `meses` da cobrança (congelados no pedido). O preço também está congelado no pedido.
        Não há reembolso/pro-rata: numa descida o plano baixa já na confirmação, mas a validade estende-se.

        A leitura do estado e a escrita não são atómicas (o `update` não filtra por `status`): duas confirmações
        simultâneas podem somar duas vezes o período (ver Achados).

        Código: backend/src/routes/assinaturaRoutes.js:25 -> backend/src/services/assinaturaService.js:509 (`confirmar`) e :441 (`aplicarConfirmacao`)
