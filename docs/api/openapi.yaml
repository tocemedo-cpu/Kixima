    post:
      operationId: adminConviteAceitar
      tags:
      - Administração
      summary: Aceita um convite de assessor e cria a conta de Admin do Sistema (público)
      description: |
        **Rota pública por desenho** (quem aceita ainda não tem conta). Define a senha, cria o utilizador `ADMIN_SISTEMA` **já activo** e invalida o convite.

        Regras de negócio:
        - O corpo só aceita `password` e `termsAccepted`. `name`, `email` e `adminAreas` vêm sempre da linha do convite — mesmo que o pedido os traga, são ignorados (`adminService.js:225-232`).
        - A senha cumpre a política de perfis sensíveis (mínimo 12 caracteres, não pode estar na lista de proibidas, nem ser sequência/repetição, nem conter a parte local do email — `utils/passwordPolicy.js`). Validada duas vezes: no Zod (`senha('ADMIN_SISTEMA')`) e no service (com o email do convite).
        - Validação do token como em `GET /api/admin/invite/{token}` (400). Se já existe um utilizador com o email do convite → 409 `CONFLICT` "Já existe uma conta com este email."
        - A criação do utilizador (`bcrypt`, custo 12; `termsAcceptedAt = agora`) e a passagem do convite a `ACEITO` ocorrem numa única transacção Prisma (token de utilização única).
