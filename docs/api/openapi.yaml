        papeis:
        - COMPRADOR
        - COMPANY_ADMIN
        - FORNECEDOR
        - FINANCEIRO
        - ADMIN_SISTEMA
        areas: []
        restricoes: Exige companyId (ADMIN_SISTEMA não pode). O alvo é validado contra o histórico da empresa do
          autor.
