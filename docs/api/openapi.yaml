  /api/conciliacao/extrato:
    post:
      operationId: conciliacaoImportarExtrato
      tags:
      - Conciliação bancária
      summary: Importar linhas do extracto bancário e conciliar automaticamente
      description: |
        Para cada linha em `linhas` (sem schema Zod; `req.body.linhas` não-array é tratado como `[]`): `idNoBanco` obrigatório (400 `Cada linha do extrato precisa de um identificador do banco.` e o lote pára aí, mantendo o que já gravou); se já existe (`LinhaExtrato.idNoBanco` único) conta em `repetidas`. Caso contrário cria a linha (`POR_CONCILIAR`) com `referencia` do corpo ou extraída da `descricao` (`KXXXX-XXXX`, alfabeto sem O/I/0/1). Montante <= 0 => `SEM_CORRESPONDENCIA` ("Linha a débito"). Para créditos: sem referência => `SEM_CORRESPONDENCIA`; fatura inexistente => `SEM_CORRESPONDENCIA`; fatura já com Payment => `DIVERGENTE`; moeda diferente => `DIVERGENTE`; valor diferente (comparação ao cêntimo, `toFixed(2)`) => `DIVERGENTE`; tudo certo => `CONCILIADA`.

        Quando concilia, numa transacção: série RC (data de emissão = `dataValor` da linha!) + `Payment` (canal `REFERENCIA_BANCARIA`, `reference` `CONC-<idNoBanco>`, `processedById` = quem importou) + `Invoice -> PAGA`. NÃO actualiza a PO (continua `AGUARDANDO_PAGAMENTO`, sem `paidAt`), NÃO cria `PlatformFee`, NÃO notifica nem publica `payment.completed`, e não valida o estado da fatura (nem notas de crédito). A auditoria `PAGAMENTO_CONCILIADO` é chamada com a assinatura errada (`auditService.record({..})` sem o cliente) e o erro é engolido por `.catch(()=>{})`: nunca é gravada. Submete o RC à Sandbox AGT.

        Concorrência: duas linhas para a mesma fatura => a segunda cai em `P2002` e fica `DIVERGENTE`; duas importações da mesma `idNoBanco` em simultâneo podem rebentar em 409 `UNIQUE_CONSTRAINT` a meio do lote. `dataValor` inválido => `Invalid Date` no Prisma => 500 a meio do lote. Tecto de tamanho do corpo: o `express.json` por omissão (100 kB; não confirmado limite configurado).

        SEGURANÇA: o acesso é por papel, não por empresa — qualquer utilizador FINANCEIRO (de QUALQUER empresa, inclusive o comprador) pode submeter linhas inventadas e marcar como pagas as suas (ou outras) faturas conhecendo a referência (ver achados).

        Código: backend/src/routes/conciliacaoRoutes.js:14 -> services/conciliacaoService.js:90 `importarExtrato` / :155 `tentarConciliar`
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-permissoes:
        papeis:
        - FINANCEIRO
        - ADMIN_SISTEMA
        areas:
        - financeiro
        restricoes: Nenhuma verificação de empresa no router nem no service. `requirePermission(financeiro)` só
          filtra ADMIN_SISTEMA.
      x-limitador: apiLimiter (600/15 min por utilizador ou IP)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - linhas
              properties:
                linhas:
                  type: array
                  description: Se não for array é tratado como vazio. Sem validação Zod nem limite de tamanho.
                  items:
                    type: object
                    required:
                    - idNoBanco
                    - montante
                    - dataValor
                    properties:
                      idNoBanco:
                        type: string
                        description: Identificador único da linha no banco (idempotência).
                      dataValor:
                        type: string
                        format: date-time
                        description: Passa a ser a data de emissão/`processedAt` do recibo RC.
                      montante:
                        type: number
                        description: Positivo = crédito. <= 0 ou NaN => linha a débito/sem correspondência.
                      moeda:
                        type: string
                        default: AOA
                      descricao:
                        type: string
                      referencia:
                        type: string
                        description: Se ausente, extraída da descrição.
            example:
              linhas:
              - idNoBanco: BAI-20260310-000123
                dataValor: '2026-03-10'
                montante: 1140000.0
                moeda: AOA
                descricao: TRF KX4F2A-9HQ7 pagamento fatura
      responses:
        '200':
          description: Resultado do lote.
          content:
            application/json:
              schema:
                type: object
                properties:
                  importadas:
                    type: integer
                  repetidas:
                    type: integer
                  conciliadas:
                    type: integer
                  porResolver:
                    type: integer
                  detalhes:
                    type: array
                    items:
                      type: object
                      properties:
                        idNoBanco:
                          type: string
                        estado:
                          type: string
                          enum:
                          - CONCILIADA
                          - SEM_CORRESPONDENCIA
                          - DIVERGENTE
                        motivo:
                          type: string
                          nullable: true
        '400':
          $ref: '#/components/responses/RegraNegocio'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '409':
          $ref: '#/components/responses/Conflito'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErroInterno'
      x-exemplo: |
        curl -X POST https://api.exemplo.ao/api/conciliacao/extrato -H 'Content-Type: application/json' --cookie 'kixima_sessao=<jwt>' -d '{"linhas":[{"idNoBanco":"BAI-20260310-000123","dataValor":"2026-03-10","montante":1140000,"moeda":"AOA","descricao":"TRF KX4F2A-9HQ7"}]}'
