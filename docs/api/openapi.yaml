  /api/payments/invoices/{invoiceId}/anular:
    post:
      operationId: faturaAnular
      tags:
      - Faturação
      summary: Anular uma fatura (nota de crédito pelo saldo total)
      description: |
        Calcula o saldo por creditar (`amount - NC existentes`); se for 0 => 409 `A fatura "X" já está totalmente creditada — não há saldo por anular.` Cria uma NC pelo valor integral do saldo via `emitir()` (mesmas guardas de posse, lock da fatura, série `-NC`, hash, auditoria e submissão silenciosa à Sandbox AGT) e a seguir submete EXPLICITAMENTE a NC à AGT (`agtPayloadService.submeterNotaCredito`, `registarFactura` + `obterEstado`), gravando em `CreditNote.agtRequestId/agtResultCode/agtErro/agtEstado` o resultado, que também vai na resposta. Uma recusa da AGT não desfaz a NC (fica `agtSubmission.sucesso=false` com `erro.details` incluindo `respostaBruta` e `pedido`).

        NÃO põe `Invoice.status = CANCELADA`: a "anulação" é derivada do saldo creditado (`saftService` marca `InvoiceStatus='A'`). Consequência verificável: a fatura continua `PENDENTE` e a PO `AGUARDANDO_PAGAMENTO`, e o comprador ainda a consegue pagar pelo valor integral (ver achados). O corpo é opcional (`motivo` por omissão `Anulação da fatura <referência>`).

        Código: backend/src/routes/paymentRoutes.js:39 -> controllers/paymentController.js:48 `anularFatura` -> services/creditNoteService.js:202 `anular`
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-permissoes:
        papeis:
        - FORNECEDOR
        - COMPANY_ADMIN
        - ADMIN_SISTEMA
        areas:
        - faturacao
        restricoes: 'Mesma posse que a emissão de NC: fornecedor da fatura ou ADMIN_SISTEMA com área `faturacao`.'
      x-limitador: apiLimiter (600/15 min por utilizador ou IP)
      parameters:
      - name: invoiceId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                motivo:
                  type: string
                  description: Opcional; por omissão 'Anulação da fatura <referência>'.
            example:
              motivo: Fatura emitida em duplicado
      responses:
        '201':
          description: NC criada e resultado da submissão explícita à AGT.
          content:
            application/json:
              schema:
                type: object
                properties:
                  creditNote:
                    $ref: '#/components/schemas/E_CreditNote'
                  agtSubmission:
                    nullable: true
                    description: '`null` se a fatura não tem fornecedor resolvido; caso contrário o resultado da
                      tentativa.'
                    type: object
                    properties:
                      sucesso:
                        type: boolean
                      payload:
                        type: object
                        additionalProperties: true
                        description: Presente se sucesso. Envelope AGT schema 2.0 enviado.
                      resposta:
                        type: object
                        additionalProperties: true
                        description: Presente se sucesso. Resposta da AGT.
                      estado:
                        type: object
                        nullable: true
                        additionalProperties: true
                      erro:
                        type: object
                        description: Presente se não sucesso.
                        properties:
                          message:
                            type: string
                          code:
                            type: string
                            nullable: true
                          details:
                            type: object
                            nullable: true
                            additionalProperties: true
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          $ref: '#/components/responses/DadosInvalidos'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErroInterno'
      x-exemplo: |
        curl -X POST https://api.exemplo.ao/api/payments/invoices/9e8d7c6b-0000-4000-8000-000000000003/anular -H 'Content-Type: application/json' --cookie 'kixima_sessao=<jwt>' -d '{"motivo":"Fatura em duplicado"}'
  /api/payments/invoices/{invoiceId}/notas-credito:
    post:
      operationId: notaCreditoEmitir
      tags:
      - Faturação
      summary: Emitir uma nota de crédito sobre uma fatura
      description: |
        Mecanismo de correcção fiscal: a fatura emitida é imutável. Corpo SEM schema Zod (validado no service): `motivo` obrigatório e não vazio (422), `amount` número finito > 0, COM IVA (mesma base que `Invoice.amount`). `netAmount = round2(amount / 1,14)` e `taxAmount = amount - netAmount`.

        Posse: o fornecedor da fatura ou ADMIN_SISTEMA com área `faturacao` (ou Super Admin). Dentro da transacção bloqueia a linha da fatura (`SELECT ... FOR UPDATE`) e recalcula o saldo (`amount - soma das NC`); `amount` > saldo => 409 `Esta fatura já tem X AOA creditados. Só pode creditar até Y AOA — ...`. Atribui série `<serieFiscal>-NC`/ano/número com hash encadeado (se o fornecedor tiver `serieFiscal`), cria `CreditNote` `NC-AAAA-NNNNNN` e auditoria `NOTA_CREDITO_EMITIDA` na mesma transacção.

