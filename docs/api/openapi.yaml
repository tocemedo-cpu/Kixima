    get:
      operationId: faturacaoIntegridade
      tags:
      - Faturação
      summary: Verificar a cadeia de integridade de uma série de faturas
      description: |
        Recalcula, para a série `serie` (código por fornecedor, ex.: o valor de `Company.serieFiscal`), a numeração sequencial e a cadeia de hashes das FATURAS (`Invoice`) dessa série e devolve os problemas: `BURACO_NA_NUMERACAO`, `ELO_PARTIDO`, `DOCUMENTO_ALTERADO`. Máx. 100000 faturas. Sem `serie` devolve `{serie:null, verificada:false, motivo}` (200).

        Limitações verificadas no código: (1) `ano` só é devolvido, não filtra a consulta — como a numeração reinicia por (série, ano), com mais de um ano de dados o relatório acusa falsos buracos/elos partidos; (2) só verifica `Invoice` — passar uma série `-NC` ou `-RC` devolve `integra:true` com 0 documentos; (3) o hash recalculado usa `Invoice.issuedAt`, enquanto na emissão foi calculado com o `new Date()` do código (carimbo ao segundo) — possível falso `DOCUMENTO_ALTERADO` se diferirem (não confirmado em execução). O formato da resposta difere consoante haja `serie` (`verificada` vs `integra`).

        Código: backend/src/routes/faturacaoRoutes.js:77 -> services/faturacaoService.js:206 `verificarCadeia`
