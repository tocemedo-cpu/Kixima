              - type
              - quantity
              properties:
                productId:
                  type: string
                  format: uuid
                type:
                  type: string
                  enum:
                  - ENTRADA
                  - SAIDA
                quantity:
                  type: integer
                  minimum: 1
                  description: Inteiro positivo (aceita string numérica por coerção).
                note:
                  type: string
            example:
              productId: 3f1c2d5e-1111-4222-8333-444455556666
              type: ENTRADA
              quantity: 20
              note: Reposição de armazém
