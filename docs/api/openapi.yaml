  /api/auth/password:
    patch:
      operationId: authAlterarSenha
      tags:
      - Autenticação
      summary: Alterar a própria senha
      description: |-
        Confirma a senha actual (bcrypt) e aplica a política de senha do papel (12 caracteres para COMPANY_ADMIN/FINANCEIRO/ADMIN_SISTEMA, 10 para os restantes). Efeito: novo hash e `tokenVersion + 1`, o que invalida TODAS as sessões, incluindo a actual: o cookie actual deixa de servir (o próximo pedido dá 401) e a API não emite um token novo nem limpa o cookie. Não obriga a nova senha a ser diferente da actual. Não passa pelo `authLimiter` nem tem bloqueio por falhas: a senha actual pode ser testada até ao limite geral de 600 pedidos/15 min. Uma sessão restrita (2FA em falta após o prazo) recebe 403 aqui.

        Auditoria: SENHA_ALTERADA.

        Código: backend/src/controllers/authController.js:50-62; services/authService.js:315-335
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-limitador: apiLimiter (600/15 min por utilizador)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - currentPassword
              - newPassword
              properties:
                currentPassword:
                  type: string
                  minLength: 1
                newPassword:
                  type: string
                  description: Política de utils/passwordPolicy.js; sem máximo (bcrypt só considera os primeiros
                    72 bytes).
            example:
              currentPassword: '********'
              newPassword: Uma-Frase-Longa-2026!
      responses:
        '200':
          description: Senha alterada; sessões revogadas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
              example:
                ok: true
        '401':
          description: Sem sessão válida, ou a senha actual está errada (usa 401, não 422/403).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error:
                  code: UNAUTHORIZED
                  message: A senha atual está incorreta.
        '403':
          $ref: '#/components/responses/SemPermissao'
        '422':
          description: Nova senha fora da política.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: A senha deve ter pelo menos 10 caracteres.
        '429':
          $ref: '#/components/responses/LimiteExcedido'
  /api/auth/reset-password:
    post:
      operationId: authReporSenha
      tags:
      - Autenticação
      summary: Definir nova senha com o token de recuperação
      description: |-
        Pública: o token do email é a autorização. Verifica assinatura HS256, expiração (1 h), claim `t="pwreset"` e que a tokenVersion do token ainda coincide com a do utilizador (uso único). Aplica a política de senha do PERFIL da conta (mínimo 12 para COMPANY_ADMIN/FINANCEIRO/ADMIN_SISTEMA, 10 para os restantes; lista de senhas proibidas; sem sequências/repetições; sem conter a parte local do email com 4+ caracteres). Efeito: grava o novo hash (bcrypt custo 12) e incrementa `tokenVersion` (mata o token e TODAS as sessões abertas). Não emite sessão nova, não repõe o contador/bloqueio de falhas de login e não altera a 2FA.

        Auditoria: SENHA_REPOSTA (actor anónimo + userId/email da conta). O `userId` e o `email` são devolvidos no corpo.

        Código: backend/src/controllers/authController.js:103-114; services/authService.js:353-369, 412-426
      security: []
      x-limitador: authLimiter (60/15 min por IP; só pedidos falhados contam; AUTH_RATE_LIMIT) + apiLimiter (600/15
        min)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              - password
              properties:
                token:
                  type: string
                  minLength: 10
                  description: JWT do link de recuperação.
                password:
                  type: string
                  description: Nova senha. Política de utils/passwordPolicy.js (mín. 10, ou 12 para perfis sensíveis,
                    validado no service); sem máximo.
            example:
              token: <jwt-pwreset>
              password: Uma-Frase-Longa-2026!
      responses:
        '200':
          description: Senha alterada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  userId:
                    type: string
                    format: uuid
                  email:
                    type: string
                    format: email
              example:
                ok: true
                userId: 00000000-0000-0000-0000-000000000001
                email: ana.silva@exemplo.ao
        '401':
          description: Token inválido/expirado, de outro tipo, ou já usado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error:
                  code: UNAUTHORIZED
                  message: Este link de recuperação já foi utilizado ou expirou. Peça um novo.
        '422':
          description: 'Senha fora da política (Zod no schema: mín. 10 + lista proibida; ou o service: 12 para perfis
            sensíveis).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Esta conta aprova operações com dinheiro, por isso a senha precisa de pelo menos 12 caracteres.
        '429':
          $ref: '#/components/responses/LimiteExcedido'
      x-exemplo: 'curl -H "Content-Type: application/json" -d ''{"token":"<jwt>","password":"Uma-Frase-Longa-2026!"}''
        https://kixima.example/api/auth/reset-password'
