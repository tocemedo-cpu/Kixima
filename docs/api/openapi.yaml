              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: 'Folha de cálculo .xlsx (também aceita pelo filtro: .xls ou MIME com "sheet"/"excel"/"officedocument.spreadsheetml").
                    Máx. 25 MB. Campo multipart `file`.'
