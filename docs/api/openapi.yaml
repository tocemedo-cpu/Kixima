      - cookieAuth: []
      - bearerAuth: []
      x-permissoes:
        papeis:
        - FORNECEDOR
        - COMPANY_ADMIN
        - ADMIN_SISTEMA
        areas:
        - faturacao
        restricoes: Empresa do utilizador (`req.user.companyId`) é o emitente; ADMIN_SISTEMA indica `supplierCompanyId`.
      x-limitador: apiLimiter (600/15 min por utilizador ou IP)
      parameters:
      - name: de
        in: query
        required: true
        description: Data inicial (AAAA-MM-DD, qualquer formato aceite por `new Date`).
        schema:
          type: string
          format: date
      - name: ate
        in: query
        required: true
        description: Data final (inclusiva).
        schema:
          type: string
          format: date
      - name: supplierCompanyId
        in: query
        required: false
        description: Obrigatório só para ADMIN_SISTEMA; ignorado para os outros papéis.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Ficheiro SAF-T em XML.
          headers:
            X-Kixima-Documentos:
              description: N.º de faturas incluídas.
              schema:
                type: string
            X-Kixima-Sem-Serie:
              description: N.º de faturas sem série certificada.
              schema:
                type: string
            Content-Disposition:
              schema:
                type: string
          content:
            application/xml:
              schema:
                type: string
                description: Documento XML `AuditFile`.
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '422':
