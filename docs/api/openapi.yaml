      summary: Faz uma cópia de segurança da base de dados agora (área Operações)
      description: |
        Executa `pg_dump` (com `--clean --if-exists`) sobre a `DIRECT_URL` (ou `DATABASE_URL`), comprime em gzip e guarda o ficheiro `kixima-<data>.sql.gz` na pasta `backups` do **bucket privado** `STORAGE_BACKUP_BUCKET`. O pedido HTTP fica aberto até a cópia terminar (pode demorar; carrega o dump todo em memória).

        Regras de negócio:
        - `requireRole('ADMIN_SISTEMA')` + `requirePermission('operacoes')`.
        - Condições (`backupJob.motivoParaNaoCorrer`): armazenamento `s3` activo, `STORAGE_BACKUP_BUCKET` definido e diferente do bucket público das imagens; senão 422 com mensagem (sem `code`).
        - Uma cópia de cada vez: se já há uma em curso, este pedido aguarda e devolve o resultado dessa (`backupJob.js:43-49`).
        - Falha da cópia → 502 com `error.message = "A cópia falhou ao fim de Xs: <err.message>"`. **Atenção**: a mensagem de erro do `child_process.execFile` inclui a linha de comando completa (confirmado no Node), que contém a URL de ligação à base de dados, com credenciais, passada como argumento a `pg_dump` (`backupJob.js:56-59`). Ver achados.
        - Auditoria: `COPIA_SEGURANCA_MANUAL` (entidade `Backup`, `detail.megabytes/segundos`) e, dentro do job, `COPIA_SEGURANCA_CONCLUIDA` (actor "Sistema", com `bucket` e `chave` do ficheiro).
        - O dump contém hashes de senha e todos os dados de todas as empresas; a resposta devolve apenas o `destino` (caminho no bucket privado, não um link público).

        Código: backend/src/routes/adminRoutes.js:172 → backend/src/jobs/backupJob.js:45 (`copiar`/`executar` :51)
