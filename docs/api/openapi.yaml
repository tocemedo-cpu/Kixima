  /api/assinatura/{id}/comprovativo:
    post:
      operationId: assinaturaComprovativo
      tags:
      - Subscrição
      summary: Carregar o comprovativo da transferência bancária de uma cobrança de plano
      description: |
        Upload multipart (campo `comprovativo`). Obrigatório: sem ficheiro 422 ("Anexe o comprovativo...").
        Tipos aceites (`config/upload.js:documentFilter`): `image/png`, `image/jpeg`/`jpg`, `image/webp`, `image/gif` e
        `application/pdf`; tamanho máximo 10 MB (`LIMIT_FILE_SIZE` -> 413). Fora disso 422 "Documento inválido - use PDF
        ou imagem (PNG/JPG).". Um campo de ficheiro com outro nome dá 400 `LIMIT_UNEXPECTED_FILE`. Além do filtro
        multer, `storageService.saveFile` confere os primeiros bytes (PDF `%PDF`, PNG, JPEG, GIF, WEBP) contra o
        `mimetype` declarado; discrepância -> 422 com a mensagem do ficheiro. SVG/HEIC são rejeitados.

        Validações: cobrança existe (404), é da empresa (403), e está em `PENDENTE` ou `COMPROVATIVO_ENVIADO` (senão 409);
        é permitido substituir o comprovativo enquanto está `COMPROVATIVO_ENVIADO` (o ficheiro anterior fica órfão no
        armazenamento). O ficheiro é guardado na pasta `proofs` (S3 em produção; disco local em desenvolvimento) com o
        nome `subscricao-<referencia>-<timestamp>.<ext>`, ANTES da actualização da base de dados (não transaccional).

        Efeitos: cobrança -> `COMPROVATIVO_ENVIADO`, `comprovativoUrl`, `submetidoEm`; auditoria
        `SUBSCRICAO_COMPROVATIVO_ENVIADO`; notificação `SUBSCRICAO_COMPROVATIVO` a todos os `ADMIN_SISTEMA` activos
        (sem filtro de área `financeiro`). Não valida valor nem referência da transferência: só a KIXIMA, ao
        confirmar, olha para o conteúdo.

        Acesso ao ficheiro em modo local: `GET /api/uploads/<ficheiro>` exige sessão e empresa dona da cobrança (ou
        ADMIN_SISTEMA). Em modo S3 o URL aponta directamente ao bucket (ver Achados).

        Código: backend/src/routes/assinaturaRoutes.js:67 -> backend/src/services/assinaturaService.js:364 (`submeterComprovativo`)
