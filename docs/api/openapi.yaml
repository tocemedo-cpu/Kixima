    put:
      operationId: erpConfigGuardar
      tags:
      - Integração ERP
      summary: Define a configuração ERP de uma empresa (cifra e sincroniza com o microserviço)
      description: |
        Só o Admin do Sistema (área `cadastro`). Ordem das verificações em `erpConfigService.setConfig`: empresa existe (404) -> plano com `erpIntegration` (só PRO) e subscrição não RESTRITA
        (400 `PLANO_INSUFICIENTE`) -> ERP válido -> empresa com `status = APROVADA` (400 "Só é possível configurar o ERP de empresas aprovadas.") -> campos obrigatórios do ERP escolhido (400 "Preencha os campos obrigatórios: ...").

        - `erp=MANUAL`: apaga as credenciais (`configEnc=null`, limpa o último teste) e, se havia ERP real, chama `DELETE /credentials/tenants/{companyId}/{erp}` no microserviço de integração.
        - ERP real: cifra `config` (AES-256-GCM) em `configEnc`; um segredo reenviado vazio ou como `••••••` mantém o valor anterior (se existir); faz `PUT /credentials/tenants/{companyId}/{erp}` ao microserviço
          (`INTEGRATION_URL` + `INTEGRATION_ADMIN_TOKEN`; se não configurados, apenas guarda) com `{enabled:true, config}` EM CLARO nesse pedido; se mudou de ERP, remove o anterior.
        - `config` é `Record<string,string>` sem limite de chaves: chaves fora de `fields` são guardadas e reenviadas ao microserviço.
        - Atenção: a verificação de obrigatórios corre ANTES da fusão com o segredo anterior, pelo que reenviar o segredo vazio falha com 400; é preciso reenviar o marcador `••••••`. Se não existir config anterior, o marcador literal seria guardado como segredo.
        - Auditoria própria `CompanyErpConfigAudit` (action `SET`, de/para ERP, actor, resultado) — não contém segredos. Não usa `auditService`.
        - A resposta é igual a `GET` (segredos mascarados) mais `integrationSynced`.

        Código: backend/src/routes/companyRoutes.js:61 -> backend/src/controllers/companyController.js:257 -> backend/src/services/erpConfigService.js:111
