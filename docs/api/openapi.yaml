    get:
      operationId: apiV1CatalogoListar
      tags:
      - API pública de catálogo (v1)
      summary: Lista o catálogo da empresa dona da chave (paginado)
      description: |-
        Lê o catálogo **da própria empresa** (filtro fixo `supplierId = empresa da chave`), do mais recentemente actualizado para o menos. Paginação por `pagina`/`limite` (limite máx. 200, por omissão 50; valores inválidos voltam aos padrões). `ativo=true|false` filtra por estado; sem o parâmetro devolve activos e desactivados. Os campos são um contrato estável em português (ver `D_ItemApiV1`).

        Autenticação por **chave de API** (não pela sessão/JWT): `Authorization: Bearer kxm_<prefixo>.<segredo>` ou, em alternativa, cabeçalho `X-Api-Key`. O serviço separa o prefixo (`kxm_` + 8 hex) do segredo, procura a chave pelo prefixo único, rejeita se `revogadaEm` está preenchido e compara a chave completa com o hash **bcrypt** guardado (`bcrypt.compare`). Depois confirma que o plano da empresa ainda inclui `apiCatalogo` e que a empresa está `APROVADA` e activa. Todas as falhas devolvem o mesmo 401 `CHAVE_INVALIDA`. Contorna login e 2FA; o âmbito é só o catálogo da própria empresa (`supplierId = empresa da chave`). O carimbo `ultimoUso` é actualizado em segundo plano. Ordem dos middlewares: `autenticarChave` e depois `limitador` — pedidos com chave inválida não passam pelo limitador por chave (só pelo `apiLimiter` global por IP).

        Código: backend/src/routes/apiCatalogoRoutes.js:99 (handler inline); autenticação em apiCatalogoRoutes.js:44 -> apiKeyService.autenticar (services/apiKeyService.js:101)
      security:
      - apiKeyBearer: []
      - apiKeyHeader: []
      x-permissoes:
        papeis: []
        areas: []
        restricoes: 'Sem papéis: a chave identifica a empresa. Só vê itens da empresa da chave.'
      x-limitador: limitador por chave (120/min, chave = prefixo da chave API; apiCatalogoRoutes.js:26-41) APÓS
        autenticarChave; adicionalmente o apiLimiter global (600/15 min por IP, porque a chave não é um JWT) também
        se aplica a /api/v1
      parameters:
      - name: pagina
        in: query
        required: false
        description: Página (>=1).
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limite
        in: query
        required: false
        description: Itens por página (1-200).
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: ativo
        in: query
        required: false
        description: Filtra por estado activo.
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
      responses:
        '200':
          description: Página de itens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/D_ApiV1Pagina'
        '401':
          description: Sem chave (`SEM_CHAVE`) ou chave inválida/revogada/empresa suspensa/plano sem API (`CHAVE_INVALIDA`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/D_ErroApiV1'
              examples:
                semChave:
                  value:
                    error:
                      code: SEM_CHAVE
                      message: 'Envie a chave em "Authorization: Bearer kxm_....". As chaves criam-se em Catálogo
                        → API, no plano Pro.'
                invalida:
                  value:
                    error:
                      code: CHAVE_INVALIDA
                      message: Chave inválida, revogada ou sem acesso à API.
        '429':
          description: Mais de 120 pedidos/min por chave (código `RATE_LIMIT`, formato próprio) ou limite global
            `apiLimiter` (código `RATE_LIMITED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/D_ErroApiV1'
              example:
                error:
                  code: RATE_LIMIT
                  message: Demasiados pedidos. O limite é de 120 por minuto por chave.
        '500':
          $ref: '#/components/responses/ErroInterno'
      x-exemplo: 'curl -H ''Authorization: Bearer kxm_<prefixo>.<segredo>'' ''https://api.exemplo.ao/api/v1/catalogo?limite=20&ativo=true'''
