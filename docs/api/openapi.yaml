  /api/auth/login:
    post:
      operationId: authLogin
      tags:
      - Autenticação
      summary: Iniciar sessão (1.º passo)
      description: |-
        Valida email + senha. Ordem das verificações em authService.login: (1) utilizador existe (senão 401 genérico); (2) conta bloqueada por tentativas (401 com os minutos que faltam); (3) conta activa (senão 403 «aguarda aprovação»); (4) empresa APROVADA (senão 403); (5) bcrypt.compare; (6) senha certa -> limpa o contador de falhas.

        Bloqueio progressivo por conta (loginAttemptService): 5 falhas seguidas e a conta fecha 1, 2, 5, 15, 30, 60 min (patamar final 60); o contador esquece após 30 min sem falhas; o titular recebe email de aviso (no máx. 1/hora). A política de senha NÃO se aplica ao login.

        Resultado: (a) sem 2FA -> sessão completa + cookie httpOnly `kixima_sessao`; o `token` também sai no corpo (clientes programáticos). (b) com 2FA activa -> NÃO há cookie nem token de sessão: devolve `requires2fa`, `metodo` e `challenge` (JWT 15 min); com método EMAIL envia já o código de 6 dígitos (reaproveita um código válido pendente; se o envio falhar devolve 400 e a mensagem diz porquê).

        Se a 2FA é obrigatória para o papel (MFA_REQUIRED_ROLES) e a conta não a tem, a sessão é emitida na mesma, com `mfaPendente` e, passado MFA_ENFORCE_FROM, `mfaRestrita` (só /api/auth/(me|logout|2fa/*), /api/users/profile e /api/notifications funcionam).

        Auditoria: LOGIN_FALHADO (qualquer erro, com email e motivo), LOGIN_SUCESSO ou LOGIN_2FA_PEDIDO. ATENÇÃO: o controller testa `result.mfaRequired`, campo que não existe (o service devolve `requires2fa`), por isso o passo da senha com 2FA fica registado como LOGIN_SUCESSO com actor nulo.

        Enumeração: as mensagens distinguem «não existe/senha errada» (401), «bloqueada» (401), «inactiva» (403) e «empresa não aprovada» (403) ANTES de verificar a senha; ver achado no .md. O email é pesquisado tal como enviado (sem normalizar maiúsculas).

        Código: backend/src/controllers/authController.js:9-44; services/authService.js:61-114; services/loginAttemptService.js
      security: []
      x-limitador: authLimiter (60/15 min por IP; só pedidos falhados contam; AUTH_RATE_LIMIT) + apiLimiter (600/15
        min)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                  description: Procurado com igualdade exacta (case-sensitive) na base.
                password:
                  type: string
                  minLength: 1
                  description: Sem máximo; só minLength 1 (a política de senha não se aplica aqui).
            example:
              email: ana.silva@exemplo.ao
              password: uma-senha-qualquer
      responses:
        '200':
          description: Sessão completa (sem 2FA) OU desafio 2FA. Distinguem-se por `requires2fa`.
          headers:
            Set-Cookie:
              description: Cookie de sessão `kixima_sessao` (httpOnly, SameSite=Lax, Secure só em produção, path=/,
                validade = JWT_EXPIRES_IN, por omissão 1 dia). utils/sessionCookie.js:41-52.
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/A_SessaoCompleta'
                - $ref: '#/components/schemas/A_Desafio2fa'
              examples:
                sessao:
                  summary: Sem 2FA
                  value:
                    token: <jwt>
                    mfaPendente: false
                    mfaRestrita: false
                    mfaPrazo: null
                    user:
                      id: 00000000-0000-0000-0000-000000000001
                      name: Ana Silva
                      email: ana.silva@exemplo.ao
                      role: COMPRADOR
                      adminAreas: []
                      companyId: 00000000-0000-0000-0000-0000000000aa
                      companyName: Exemplo Lda
                      companyType: CLIENTE
                      avatarUrl: null
                desafio:
                  summary: Com 2FA por email
                  value:
                    requires2fa: true
                    metodo: EMAIL
                    challenge: <jwt-2fa>
                    enviadoPara: a***a@exemplo.ao
                    expiraEm: '2026-10-26T10:10:00.000Z'
                    validadeMinutos: 10
        '400':
          description: '2FA por email: não foi possível enviar o código (email não configurado/falha do fornecedor).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error:
                  code: BUSINESS_RULE_VIOLATION
                  message: 'Não foi possível enviar o código para a***a@exemplo.ao: <erro>. Enquanto isto não estiver
                    resolvido, não ative a verificação por email — ficaria sem forma de entrar.'
        '401':
          description: Credenciais inválidas (email inexistente OU senha errada — mesma mensagem) ou conta bloqueada
            por tentativas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error:
                  code: UNAUTHORIZED
                  message: Credenciais inválidas.
        '403':
          description: Conta inactiva (aguarda aprovação do Company Admin) ou empresa ainda não aprovada na due
            diligence. Devolvido ANTES de verificar a senha.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error:
                  code: FORBIDDEN
                  message: A sua conta ainda aguarda aprovação do administrador da empresa.
        '422':
          $ref: '#/components/responses/DadosInvalidos'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
      x-exemplo: 'curl -i -c cookies.txt -H "Content-Type: application/json" -d ''{"email":"ana.silva@exemplo.ao","password":"********"}''
        https://kixima.example/api/auth/login'
  /api/auth/logout:
    post:
      operationId: authSair
      tags:
      - Autenticação
      summary: Terminar sessão em todos os dispositivos
      description: |-
        Incrementa `tokenVersion` (revoga todos os JWT já emitidos para o utilizador, em todos os dispositivos — não existe logout só deste dispositivo) e apaga o cookie `kixima_sessao` deste browser. Permitido em sessão restrita. Se a sessão já estiver inválida/expirada devolve 401 e o cookie morto NÃO é apagado.

        Auditoria: SESSOES_TERMINADAS.

        Código: backend/src/controllers/authController.js:65-80; services/authService.js:32-35 (revokeSessions); utils/sessionCookie.js:limpar
      security:
