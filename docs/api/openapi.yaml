  /api/supplier-development/requests/{id}/approve:
    patch:
      operationId: supDevAprovar
      tags:
      - Supplier Development
      summary: Aprova a candidatura (cria empresa fornecedora, apólice e convite de fundação)
      description: |
        Admin do Sistema (`suporte`). O corpo exige sempre `policy` (mesmo quando não é usada).
        - Candidatura CONCLUIDA ou REJEITADA -> 400.
        - Se a candidatura já tem `companyId` (submetida com sessão): apenas passa a CONCLUIDA (`handledBy`, `handledAt`); não cria nada e não verifica a empresa.
        - Caso contrário: NIF = `taxId` do corpo ou o da candidatura (em falta -> 422 "Indique o NIF da empresa para criar a conta."); NIF já existente -> 409; email de contacto já com conta -> 409.
          Numa transacção cria `Company` (FORNECEDOR, `status=PENDENTE`), `SupplierToKiximaPolicy` (`SUBMETIDA`, moeda por omissão AOA) e marca a candidatura `CONCLUIDA` com `companyId`.
          FORA da transacção cria o convite de fundação (`createFoundingInvite`, role COMPANY_ADMIN, 7 dias) e envia o email "A sua empresa foi aprovada na KIXIMA — crie a sua conta" com link `<APP_URL|host do pedido>/convite/<token>`.
          Se este passo falhar a candidatura já está CONCLUIDA (não dá para repetir) e a empresa fica sem admin; falhas de envio de email são engolidas.
        - A empresa criada continua PENDENTE: a due diligence (`PATCH /api/companies/{id}/decision`) é um passo distinto; o admin que aceita o convite nasce activo mas só consegue entrar com a empresa APROVADA.
        - Não grava documentos de credenciamento nem dados bancários; não regista auditoria.

        Código: backend/src/routes/supplierDevRoutes.js:54 -> backend/src/services/supplierDevService.js:151 (convite: backend/src/services/companyService.js:464)
