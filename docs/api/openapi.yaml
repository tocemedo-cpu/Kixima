        areas: []
        restricoes: Importa para a empresa da sessão (req.user.companyId); plano PRO. Não valida tipo/estado da
          empresa.
      x-limitador: apiLimiter (600/15 min por utilizador ou IP, app.js:142)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
