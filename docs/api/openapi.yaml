  /api/payments/invoices/{invoiceId}/pay:
    post:
      operationId: pagamentoExecutar
      tags:
      - Pagamentos
      summary: Pagar uma fatura com comprovativo obrigatório
      description: |
        O Financeiro (ou Company Admin) da empresa compradora regista o pagamento. Não há valor no corpo: o montante registado é sempre `Invoice.amount` (total com IVA) na moeda da fatura. O comprovativo é OBRIGATÓRIO (multipart, campo `proof`; PDF, PNG, JPEG, WEBP ou GIF; máx. 10 MB; `config/upload.js` + verificação de bytes mágicos em `storageService.saveFile`) — sem ficheiro 422 `Anexe o comprovativo da transferência (PDF ou imagem) para confirmar o pagamento.`; tipo não permitido 422 `Documento inválido — use PDF ou imagem (PNG/JPG).`; ficheiro maior 413 `LIMIT_FILE_SIZE`; campo com outro nome 400 `LIMIT_UNEXPECTED_FILE`.

        Regras: fatura inexistente 404; estado diferente de `PENDENTE` 409 `Fatura no estado "X" não pode ser paga.`; a fatura tem de ser da empresa do utilizador (403 `Só pode pagar faturas da sua própria empresa.`). Não valida vencimento (`dueAt`), notas de crédito emitidas, nem confirma que o dinheiro existe: o estado muda com base apenas no comprovativo carregado.

        Numa transacção: série `<serieFiscal>-RC` (o pagamento é o recibo AGT "RC") com hash encadeado; `Payment` (`PAY-XXXXXXXX`, canal por omissão `TRANSFERENCIA_MANUAL`, `proofUrl`); `Invoice -> PAGA`; PO normal -> `PAGA` + `paidAt` (consolidada: só `paidAt` nas call-offs); `PlatformFee` (taxa KIXIMA ao fornecedor); auditoria `PAGAMENTO_EXECUTADO`. O comprovativo é gravado ANTES da transacção (fica órfão se a transacção falhar).

        Depois do commit: notificação `pagamentoProcessado` (só com PO), evento `payment.completed` (eventId `payment-completed:<id>`), **reenvio síncrono do FT à AGT** (`registarFactura` + `obterEstado`) com resultado gravado na fatura (`agtRequestId/agtResultCode/agtErro/agtEstado`) e devolvido em `agtInvoiceResubmission` (uma recusa NÃO desfaz o pagamento), e submissão silenciosa do RC à Sandbox.

        Concorrência: dois pedidos simultâneos para a mesma fatura passam ambos a verificação de estado, mas `Payment.invoiceId` é único => o segundo recebe 409 `UNIQUE_CONSTRAINT` e o número RC reverte; o comprovativo do segundo fica órfão.

        Código: backend/src/routes/paymentRoutes.js:51 -> controllers/paymentController.js:15 `pay` -> services/paymentService.js:48 `processPayment`
