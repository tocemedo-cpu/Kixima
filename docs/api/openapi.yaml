    patch:
      operationId: apiV1CatalogoAtualizar
      tags:
      - API pública de catálogo (v1)
      summary: Actualiza preço, stock e disponibilidade de um item por SKU
      description: |-
        Actualiza (parcialmente) o item da empresa dona da chave. Campos aceites (`req.body`, validação manual, sem Zod): `preco` (número > 0), `precoPromocional` (número > 0 ou `null` para limpar), `stock` (inteiro >= 0), `disponibilidade` (texto, convertido com `String()`), `prazoEntregaDias` (`Number()`, **sem validação**: NaN/negativo seguem para a base de dados), `ativo` (`Boolean()`). Pelo menos um campo é obrigatório (422 `NADA_A_ALTERAR`); erros de valor devolvem 422 `DADOS_INVALIDOS` com mensagens concatenadas.

        Pontos fracos confirmados: `Number(null)` e `Number("")` valem 0, portanto `stock: null`/`""` define o stock como 0 e `preco: null` é recusado; `Boolean("false")` é `true`, pelo que `ativo: "false"` (string) activa em vez de desactivar e `ativo: null` desactiva; `precoPromocional` não é comparado com `preco`; valores acima de Decimal(14,2) provocam 500. Não cria `StockMovement`, não envia `ESTOQUE_BAIXO`.

        Auditoria: `CATALOGO_ATUALIZADO_POR_API` com `actorName = "API (<prefixo>)"`, `companyId` da empresa, IP do cliente e os nomes dos campos alterados.

        Autenticação por **chave de API** (não pela sessão/JWT): `Authorization: Bearer kxm_<prefixo>.<segredo>` ou, em alternativa, cabeçalho `X-Api-Key`. O serviço separa o prefixo (`kxm_` + 8 hex) do segredo, procura a chave pelo prefixo único, rejeita se `revogadaEm` está preenchido e compara a chave completa com o hash **bcrypt** guardado (`bcrypt.compare`). Depois confirma que o plano da empresa ainda inclui `apiCatalogo` e que a empresa está `APROVADA` e activa. Todas as falhas devolvem o mesmo 401 `CHAVE_INVALIDA`. Contorna login e 2FA; o âmbito é só o catálogo da própria empresa (`supplierId = empresa da chave`). O carimbo `ultimoUso` é actualizado em segundo plano. Ordem dos middlewares: `autenticarChave` e depois `limitador` — pedidos com chave inválida não passam pelo limitador por chave (só pelo `apiLimiter` global por IP).

        Código: backend/src/routes/apiCatalogoRoutes.js:127 (handler inline); audit em apiCatalogoRoutes.js:169
      security:
      - apiKeyBearer: []
      - apiKeyHeader: []
      x-permissoes:
        papeis: []
        areas: []
        restricoes: Só itens da empresa da chave.
      x-limitador: limitador por chave (120/min, chave = prefixo da chave API; apiCatalogoRoutes.js:26-41) APÓS
        autenticarChave; adicionalmente o apiLimiter global (600/15 min por IP, porque a chave não é um JWT) também
        se aplica a /api/v1
      parameters:
      - name: sku
        in: path
        required: true
        description: SKU do item.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                preco:
                  type: number
                  exclusiveMinimum: true
                  minimum: 0
                precoPromocional:
                  type: number
                  exclusiveMinimum: true
                  nullable: true
                  minimum: 0
                stock:
                  type: integer
                  minimum: 0
                disponibilidade:
                  type: string
                prazoEntregaDias:
                  type: integer
                  description: Sem validação no servidor.
                ativo:
                  type: boolean
            example:
              preco: 92500
              stock: 35
      responses:
        '200':
          description: Item após a alteração.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/D_ItemApiV1'
        '401':
          description: Sem chave (`SEM_CHAVE`) ou chave inválida/revogada/empresa suspensa/plano sem API (`CHAVE_INVALIDA`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/D_ErroApiV1'
              examples:
                semChave:
                  value:
                    error:
                      code: SEM_CHAVE
                      message: 'Envie a chave em "Authorization: Bearer kxm_....". As chaves criam-se em Catálogo
                        → API, no plano Pro.'
                invalida:
                  value:
                    error:
                      code: CHAVE_INVALIDA
                      message: Chave inválida, revogada ou sem acesso à API.
        '404':
          description: SKU inexistente nesta empresa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/D_ErroApiV1'
              example:
                error:
                  code: NAO_ENCONTRADO
                  message: Não existe nenhum item com o SKU "VLV-001" nesta empresa.
        '422':
          description: Valores inválidos (`DADOS_INVALIDOS`) ou nenhum campo enviado (`NADA_A_ALTERAR`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/D_ErroApiV1'
              examples:
                invalido:
                  value:
                    error:
                      code: DADOS_INVALIDOS
                      message: preco tem de ser um número maior do que zero
                vazio:
                  value:
                    error:
                      code: NADA_A_ALTERAR
                      message: 'Envie pelo menos um de: preco, precoPromocional, stock, disponibilidade, prazoEntregaDias,
                        ativo.'
        '429':
          description: Mais de 120 pedidos/min por chave (código `RATE_LIMIT`, formato próprio) ou limite global
            `apiLimiter` (código `RATE_LIMITED`).
          content:
