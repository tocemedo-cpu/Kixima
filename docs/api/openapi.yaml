      tags:
      - Utilizadores
      summary: Eliminar (anonimizar) a própria conta — irreversível
      description: |-
        Exerce o direito de eliminação como ANONIMIZAÇÃO (o trilho financeiro tem de sobreviver). Exige a senha actual no corpo (sem a 2FA nem outra confirmação). Numa transacção: nome -> «Utilizador anonimizado», email -> `anonimizado-<8 do id>@anonimo.kixima`, avatar, locale, segredo e data da 2FA apagados, conta `active=false` e `tokenVersion + 1` (sessões invalidadas); `auditLog.actorName` das acções do utilizador é substituído; notificações pessoais (`userId`) apagadas; regista DADOS_PESSOAIS_ANONIMIZADOS (sem nome). Não limpa: `passwordHash`, `mfaMethod`/código pendente, `entityRef` dos registos de auditoria (que guarda o email nos eventos de login/senha) nem os IPs; não apaga o ficheiro do avatar; não limpa o cookie no browser. Sem salvaguarda para o último COMPANY_ADMIN da empresa nem para o último ADMIN_SISTEMA. Palavra-passe errada devolve 422 (não 401).

        Código: backend/src/routes/userRoutes.js:61-72; services/dadosPessoaisService.js:93-155 (anonimizar)
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-permissoes:
        papeis:
        - COMPRADOR
        - COMPANY_ADMIN
        - FORNECEDOR
        - FINANCEIRO
        - ADMIN_SISTEMA
        areas: []
        restricoes: Só a própria conta; confirma a senha actual.
      x-limitador: apiLimiter (600/15 min por utilizador) — a senha pode ser testada sem bloqueio por conta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - password
              properties:
                password:
                  type: string
                  description: 'Senha actual (sem Zod: String(req.body.password || "")).'
                motivo:
                  type: string
                  description: Opcional; guardado em texto livre no registo de auditoria (sem limite de tamanho
                    além do corpo).
            example:
              password: '********'
              motivo: Pedido do titular
      responses:
        '200':
          description: Conta anonimizada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  utilizador:
                    type: object
