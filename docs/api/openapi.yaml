    post:
      operationId: assinaturaPedir
      tags:
      - Subscrição
      summary: Pedir (emitir a cobrança de) um plano - não muda o plano
      description: |
        Emite uma cobrança `PlanoCobranca` em estado `PENDENTE` para o plano pedido (subir, descer ou renovar). NÃO
        altera o plano: o plano só muda na confirmação (regra 1) e o preço fica congelado na cobrança (regra 2:
        `valorUsd`, `periodo`, `meses` copiados de `planService.preco`). A referência é `SUB-AAAA-NNNNNN`.

        Validações no servidor, por ordem: `plano` (case-insensitive, convertido para maiúsculas) tem de ser `BASE`,
        `CORE` ou `PRO` (422); a empresa existe (404) e está `APROVADA` (400); não há outra cobrança em aberto
        (409; a regra é garantida por índice único parcial `plano_cobrancas_company_id_aberta_key`, migração
        20260918000000, e o `P2002` é traduzido na mesma mensagem); `impedimento`: a dimensão da empresa
        (`MICRO/PEQUENA/MEDIA/GRANDE`) exige um plano mínimo (GRANDE só pode subscrever PRO) e, numa DESCIDA, o
        número de lugares ocupados (utilizadores activos + convites pendentes) não pode exceder `lugaresIncluidos` do
        plano alvo (BASE 2, CORE 5, PRO ilimitado; renovar o plano actual nunca é bloqueado por lugares) -> 400;
        `perdas`: se a descida faz perder funcionalidades em uso (chaves de API activas, kits, contratos-quadro
        activos) é preciso `aceitaPerdas: true` (comparado com `=== true`), senão 400 com a lista.

        Efeitos: auditoria `SUBSCRICAO_PEDIDA` (best-effort, `recordSafe`). Não envia notificações. A resposta é 201
        com a cobrança.

        Atenção: o estado `RESTRITA` (vencida há mais que a tolerância) não impede pedir/renovar.

        Código: backend/src/routes/assinaturaRoutes.js:38 -> backend/src/services/assinaturaService.js:272 (`pedir`)
