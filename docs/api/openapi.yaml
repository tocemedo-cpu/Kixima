  /api/companies/{id}/erp-config:
    get:
      operationId: erpConfigObter
      tags:
      - Integração ERP
      summary: Obtém a configuração ERP de uma empresa (segredos mascarados)
      description: |
        Só o Admin do Sistema. Lê `CompanyErpConfig`, decifra `configEnc` (AES-256-GCM, chave `ERP_CONFIG_ENCRYPTION_KEY`; formato base64(iv|tag|ciphertext)) e devolve a
        configuração com os campos marcados `secret` substituídos por `••••••` (ou `""` se vazios): `apiKey` (PRIMAVERA), `password` (SAP_S4HANA, ORACLE_ERP_CLOUD), `sharedSecret` (SAP_ARIBA).
        Campos NÃO secretos (`baseUrl`, `username`, `company`, `client`, `networkId`) saem em claro. Falha de decifragem (chave em falta/errada) é engolida e devolve `config` vazio.
        `fields` descreve o formulário dinâmico por ERP. Empresa inexistente -> 404. Sem ERP configurado -> `erp: MANUAL`, `lastTest: null`. Não exige plano PRO para ler.
        Nunca devolve `configEnc` nem o segredo.

