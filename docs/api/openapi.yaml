    post:
      operationId: feedbackCriar
      tags:
      - Avaliações
      summary: Enviar uma avaliação (nunca anónima)
      description: |-
        Cria uma avaliação com autoria e empresa vindas da sessão (nunca do corpo). Sem esquema Zod: a validação é manual no service. Regras: o utilizador tem de ter empresa (ADMIN_SISTEMA recebe 422); `categoria` ∈ CATEGORIAS; `rating` inteiro 1–5 (aceita string numérica); `message` obrigatória, aparada e CORTADA em silêncio aos 700 caracteres; para qualquer categoria exceto EXPERIENCIA_GERAL, `targetId` tem de existir no histórico da empresa do autor (fornecedor/contraparte numa ordem, produto/serviço numa ordem, ordem, ordem entregue/recebida, pagamento PROCESSADO, ticket da empresa ou do próprio). Guarda `targetLabel` (snapshot), `verified=true` e `approved=false`: só aparece na parede pública depois de aprovada pelo Admin do Sistema (routes/adminRoutes.js, fora deste grupo). Sem limite de avaliações por alvo nem anti-duplicado. Sem notificações nem auditoria.

        Código: backend/src/routes/feedbackRoutes.js:29-39; services/feedbackService.js:criar, resolverAlvo
