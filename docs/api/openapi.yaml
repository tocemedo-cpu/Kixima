  /api/assinatura/{id}/pagar-com:
    post:
      operationId: assinaturaPagarCom
      tags:
      - Subscrição
      summary: Iniciar o pagamento de uma cobrança num canal automático (EMIS, PayPay, banco)
      description: |
        Alternativa à transferência manual, só para planos `BASE` e `CORE` (o `PRO` só se paga por transferência com
        comprovativo confirmada por humano). Valida o canal (`EMIS_MULTICAIXA`, `PAYPAY`, `BAI`, `BFA`,
        `STANDARD_BANK_ANGOLA`; 422), que a cobrança pertence à empresa (404/403), que está `PENDENTE` (409) e que o
        plano é BASE/CORE (400). Chama o adaptador (`pedirPagamento` com `moeda: 'USD'`), exige que devolva `id` ou
        `transactionId` e grava `canal`, `referenciaExterna` e `telemovel` na cobrança. NÃO confirma nada: a
        confirmação só acontece em `POST /api/webhooks/pagamento/{canal}` (fora deste grupo; sem sessão, verifica contra o
        gateway) que chama `confirmarViaGateway` e activa o plano sem intervenção humana.

        Problemas conhecidos: (a) os adaptadores lançam `Error` simples, por isso canal não configurado ou recusa do
        gateway chegam como 500 `INTERNAL_ERROR` (e não 503); (b) `EMIS_MULTICAIXA` rejeita sempre moeda diferente de
        AOA e esta rota envia sempre USD, logo falha sempre; (c) pode ser chamada várias vezes enquanto a cobrança
        estiver `PENDENTE`, sobrescrevendo `referenciaExterna` (ver Achados). Auditoria `SUBSCRICAO_PAGAMENTO_INICIADO`.

        Código: backend/src/routes/assinaturaRoutes.js:56 -> backend/src/services/assinaturaService.js:547 (`iniciarPagamentoGateway`)
