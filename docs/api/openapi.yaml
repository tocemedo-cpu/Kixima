      description: |
        O Company Admin convida um funcionário. Quem pode ser convidado depende do tipo da empresa (`INVITABLE_ROLES`): CLIENTE ->
        COMPRADOR, FINANCEIRO; FORNECEDOR -> COMPRADOR, FORNECEDOR (Vendedor), FINANCEIRO. Fora disto -> 400 `BUSINESS_RULE_VIOLATION`.

        Regras e efeitos:
        - Subscrição RESTRITA (vencida há mais de `KIXIMA_GRACE_PERIOD_DAYS`, por omissão 7) -> 400 `PLANO_INSUFICIENTE` ("... Regularize o pagamento para poder convidar mais utilizadores.").
        - Limite de lugares do plano (BASE 2, CORE/BASICO 5, PRO ilimitado): conta utilizadores activos + convites PENDENTE não expirados;
          excedido -> 400 `PLANO_INSUFICIENTE` com `details.planoNecessario`.
        - Email já existente em `User` -> 409 `CONFLICT`. Não se verifica convite pendente duplicado para o mesmo email.
        - Cria `EmployeeInvite` (PENDENTE, 7 dias), assina o token JWT com o `inviteId`, guarda-o e ENVIA email (link `<APP_URL|host do pedido>/convite/<token>`).
