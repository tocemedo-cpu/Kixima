                  default: {}
                  description: |
                    Campos por ERP (ERP_FIELDS): PRIMAVERA {baseUrl*, apiKey*(segredo), company*}; SAP_S4HANA {baseUrl*, username*, password*(segredo), client};
                    ORACLE_ERP_CLOUD {baseUrl*, username*, password*(segredo)}; SAP_ARIBA {baseUrl*, sharedSecret*(segredo), networkId*}; MANUAL {}.
            example:
