  /api/auth/2fa/verify:
    post:
      operationId: auth2faVerificar
      tags:
      - Autenticação 2FA
      summary: 'Iniciar sessão (2.º passo): desafio + código'
      description: |-
        Pública: o `challenge` devolvido pelo login é a autorização. Valida o JWT (claim `t="2fa"`), recarrega o utilizador (activo e tokenVersion igual) e confirma o código conforme `mfaMethod`: TOTP (RFC 6238, SHA-1, 6 dígitos, passo 30 s, janela ±1 passo) ou EMAIL (código de 6 dígitos, hash bcrypt, validade 10 min, máx. 5 tentativas, uso único). Sucesso -> sessão completa + cookie `kixima_sessao` (mesmo corpo que o login sem 2FA).

        Não há contador de falhas por conta para o TOTP, e as falhas deste passo não somam ao bloqueio de login; o desafio dura 15 min e não é de uso único. Só o authLimiter por IP trava tentativas. Não repete as verificações de bloqueio da conta nem de empresa aprovada do login. Não há registo de auditoria neste passo (nem sucesso nem falha).

        Código: backend/src/controllers/authController.js:168-172; services/authService.js:268-294 (verify2fa); services/mfaEmailService.js:confirmarCodigo; utils/totp.js
      security: []
      x-limitador: authLimiter (60/15 min por IP; só pedidos falhados contam; AUTH_RATE_LIMIT) + apiLimiter (600/15
        min)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - challenge
              - code
              properties:
                challenge:
                  type: string
                  minLength: 10
                code:
                  type: string
                  pattern: ^\d{6}$
                  description: Código de 6 dígitos.
            example:
              challenge: <jwt-2fa>
              code: '123456'
      responses:
        '200':
          description: Sessão completa.
          headers:
            Set-Cookie:
              description: Cookie de sessão `kixima_sessao` (httpOnly, SameSite=Lax, Secure só em produção, path=/,
                validade = JWT_EXPIRES_IN, por omissão 1 dia). utils/sessionCookie.js:41-52.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/A_SessaoCompleta'
        '401':
          description: Desafio expirado/inválido, sessão inválida, ou código incorrecto/expirado/esgotado (a mensagem
            diz o que falta, incluindo desvio do relógio no TOTP).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error:
                  code: UNAUTHORIZED
                  message: Código incorreto. 4 tentativa(s) antes de o código ser anulado. Confirme que está a usar
                    o email mais recente — os anteriores deixaram de servir.
        '422':
          description: Código não tem 6 dígitos / challenge em falta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Dados inválidos.
                  details:
                    formErrors: []
                    fieldErrors:
                      code:
                      - O código tem 6 dígitos.
        '429':
          $ref: '#/components/responses/LimiteExcedido'
      x-exemplo: 'curl -i -c cookies.txt -H "Content-Type: application/json" -d ''{"challenge":"<jwt-2fa>","code":"123456"}''
        https://kixima.example/api/auth/2fa/verify'
