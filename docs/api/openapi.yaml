  /api/integration/callback:
    post:
      operationId: integracaoCallback
      tags:
      - Integração ERP
      summary: Callback assinado (HMAC) do microserviço de integração ERP
      description: |
        Endpoint sem sessão por desenho: quem chama é o `kixima-integration-service`, autenticado por assinatura HMAC-SHA256 do corpo bruto (`req.rawBody`, guardado por `express.json({verify})`) no cabeçalho `X-Kixima-Signature` (hex),
        com a variável de ambiente `KIXIMA_CALLBACK_SECRET` (segredo partilhado único para todas as empresas). Comparação em tempo constante (`crypto.timingSafeEqual`).

        - Sem `KIXIMA_CALLBACK_SECRET` -> 503 `CALLBACK_NOT_CONFIGURED` (falha fechada).
        - Assinatura ausente/errada -> 401 `INVALID_SIGNATURE`.
        - Não há timestamp nem nonce na assinatura: um pedido capturado pode ser reenviado (a idempotência é só pelo estado da PO).
        - Corpo `{ type, data }`. Tipos tratados:
          * `purchase_order.approval_decided` (`data.poId`, `data.aprovado` boolean, `erpExternalId?`, `motivo?`) -> `poService.aplicarDecisaoErp`: PO tem de existir e ser `erpManaged`; só aplica se estiver AGUARDANDO_APROVACAO (decisão reivindicada por `updateMany` com filtro de estado);
            passa a APROVADA ou REJEITADA (com motivo), regista `ErpSyncLog`, auditoria (`PO_APROVADA_ERP`/`PO_REJEITADA_ERP`) e notifica; não republica no eventBus.
          * `payment.confirmed` (`data.poId`, `erpExternalId?`, `valorPago?`, `pagoEm?`) -> `poService.aplicarPagamentoErp`: PO `erpManaged` com factura e em AGUARDANDO_PAGAMENTO; cria o Recibo certificado (série do fornecedor), `Payment` canal ERP,
            marca factura e PO como PAGA e cria a Taxa KIXIMA (`PlatformFee`). Idempotente por estado (PO já PAGA devolve sem repetir). O valor `valorPago` não é confrontado com a factura.
          * Qualquer outro `type`: registado em log e ignorado (200 `{received:true}`).
        - Erros de NEGÓCIO (PO inexistente, não ERP, estado inválido, payload mal formado) NÃO devolvem 4xx/5xx: respondem 200 `{received:true, error:"<mensagem>"}` e, se há `poId`, gravam `ErpSyncLog` FAILED — para o microserviço não repetir.
        - O payload completo não é registado em log (só o `type`). A rota fica sujeita ao `apiLimiter` (600/15 min por IP).

        Código: backend/src/routes/integrationRoutes.js:26 -> backend/src/services/poService.js:359 (decisão) e :420 (pagamento)
      security: []
      parameters:
      - name: X-Kixima-Signature
        in: header
        required: true
        schema:
          type: string
        description: HMAC-SHA256 hex do corpo bruto com KIXIMA_CALLBACK_SECRET
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - type
              - data
              properties:
                type:
                  type: string
                  enum:
                  - purchase_order.approval_decided
                  - payment.confirmed
                data:
                  type: object
                  properties:
                    poId:
                      type: string
                      format: uuid
                    aprovado:
                      type: boolean
                      description: Só em approval_decided; obrigatório
                    motivo:
                      type: string
                    erpExternalId:
                      type: string
                    valorPago:
                      type: number
                    pagoEm:
                      type: string
                      format: date-time
            examples:
              aprovacao:
                value:
                  type: purchase_order.approval_decided
                  data:
                    poId: 6f1d0c2e-0000-4000-8000-000000000001
                    aprovado: true
                    erpExternalId: ERP-APR-001
              pagamento:
                value:
                  type: payment.confirmed
                  data:
                    poId: 6f1d0c2e-0000-4000-8000-000000000001
                    erpExternalId: ERP-PAY-001
                    valorPago: 1500000
                    pagoEm: '2026-10-20T10:00:00Z'
      responses:
        '200':
          description: Receção confirmada (incluindo quando a lógica de negócio falhou — nesse caso vem `error`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                    example: true
                  error:
                    type: string
                    description: Presente quando o processamento de negócio falhou
        '401':
          description: Assinatura inválida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error:
                  code: INVALID_SIGNATURE
                  message: Assinatura inválida.
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '503':
          description: Segredo do callback não configurado no ambiente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error:
                  code: CALLBACK_NOT_CONFIGURED
                  message: Callback de integração não configurado.
      x-exemplo: |
        BODY='{"type":"payment.confirmed","data":{"poId":"6f1d0c2e-0000-4000-8000-000000000001"}}'
        SIG=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$KIXIMA_CALLBACK_SECRET" -hex | awk '{print $NF}')
        curl -X POST https://api.exemplo.ao/api/integration/callback -H 'Content-Type: application/json' \
          -H "X-Kixima-Signature: $SIG" -d "$BODY"
