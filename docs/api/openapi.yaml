      summary: Publica um produto/serviço (com imagens e documentos)
      description: |-
        Cria um produto da empresa do utilizador. Aceita `multipart/form-data` (campos de texto + ficheiros) ou JSON. O middleware `uploadProductMedia.fields(...)` corre antes da validação Zod.

        **Ficheiros** (limite 15 MB por ficheiro, em memória): `mainImage` (1), `gallery` (até 10) — só imagens png/jpeg/webp/gif (SVG e HEIC recusados, 422); e documentos técnicos, cada campo até 5 ficheiros: `FICHA_TECNICA`, `DATASHEET`, `MANUAL`, `CATALOGO`, `CERTIFICADO`, `DESENHO_TECNICO` — PDF ou imagem. O tipo declarado é depois conferido contra os bytes (`fileSignature.verificar` em `storageService.saveFile`). Campo de ficheiro fora desta lista => 400 `LIMIT_UNEXPECTED_FILE`; ficheiro maior => 413 `LIMIT_FILE_SIZE`.

        **Regras**: a empresa tem de ser `FORNECEDOR` (403) e `APROVADA` (403). O plano limita a média por item: imagens (BASE 3 / CORE e PRO 10, contando a `mainImage`) e documentos (BASE 1 / CORE 3 / PRO 6) — `PLANO_INSUFICIENTE`. Os limites são verificados DEPOIS de o multer ter carregado todos os ficheiros em memória (até 41 ficheiros x 15 MB). Não há limite do número de itens do catálogo.

        **Preços/quantidades**: `unitPrice` > 0 obrigatório; `promoPrice` >= 0 (pode ser 0 ou superior ao preço normal); `minQuantity`, `maxQuantity`, `stockQuantity`, `minStock`, `leadTimeDays` inteiros >= 0 sem relação entre si; sem máximos (valores acima de Decimal(14,2) ou Int32 provocam erro da base de dados => 500). `currency` por omissão `AOA` (texto livre). Campos extra (`kind`, `certifications`, `specialty`, `city`, `active`, `supplierId`...) são descartados pelo Zod, logo **não é possível criar um SERVICO** por este endpoint.

        O slug é gerado a partir do nome + 6 caracteres aleatórios. Se não há `mainImage` a 1.ª imagem da galeria passa a principal; se não houver ficheiros usa-se `imageUrl` (texto livre, não validado). Os ficheiros são guardados no storage antes da escrita na base (falha na BD deixa ficheiros órfãos). Auditoria `CATALOGO_PRODUTO_CRIADO`.

