        Agrega, a partir de dados reais, as estatísticas da empresa **do utilizador autenticado** (`req.user.companyId`):
        número de produtos/activos/stock baixo, ordens de compra por estado, receita reconhecida, produtos mais vendidos e mais vistos.

        Regras de negócio:
        - A janela de histórico depende do plano da empresa (`historicoRelatoriosMeses`: BASE 3 meses, CORE 12, PRO ilimitado — `planService.js:197,216,235`).
          Sem `meses`, aplica-se a janela do plano; com `meses`, vale o menor dos dois (pedir menos histórico é sempre permitido). Se o pedido excede o plano, `janela.truncada = true`.
        - `meses` é lido sem validação Zod: `Number(...)`; valores não numéricos, zero ou negativos são ignorados (equivale a "não pedido"); decimais são arredondados para baixo.
        - Só os dados **datados** (ordens, receita, mais vendidos) respeitam a janela; `totalProducts`, `activeProducts`, `lowStock`, `totalViews` e `topViewed` são estado presente (listados em `janela.semJanela`).
        - Receita = soma de `totalAmount` das POs em `PAGA, EM_EXECUCAO, ENTREGUE, RECEBIDA_CONFORME, RECEBIDA_COM_DIVERGENCIA, CONCLUIDA` (o `totalAmount` inclui IVA — `schema.prisma:908`).
        - Isolamento entre empresas: todas as consultas filtram por `supplierId`/`supplierCompanyId = req.user.companyId`; não existe parâmetro que permita indicar outra empresa. Um `COMPANY_ADMIN` de uma empresa compradora recebe contagens a zero (não há erro).
        - Formato: apenas JSON. Não há exportação CSV/PDF/XLSX neste endpoint. Sem paginação (agregação em memória sobre as linhas de PO da janela — `reportsService.js:58,71-74`). **Limite silencioso**: os `findMany` sem `take` ficam limitados a 1000 linhas (`DB_MAX_ROWS`, `config/database.js:29,42-45`); acima disso `topProducts`, `totalProducts`, `activeProducts` e `lowStock` ficam calculados sobre uma amostra truncada, só com uma linha de erro no log.
        - Sem efeitos secundários (só leitura; sem auditoria).

        Código: backend/src/routes/reportsRoutes.js:16 → backend/src/services/reportsService.js:47 (`supplierStats`)
