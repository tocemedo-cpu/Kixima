      summary: Cria directamente um utilizador (Company Admin ou Admin do Sistema)
      description: |
        Criação directa, sem convite, com senha definida por quem cria. O utilizador nasce ACTIVO (`active` por omissão do modelo).

        - COMPANY_ADMIN: `companyId` do corpo é ignorado; usa sempre o da sua empresa.
        - ADMIN_SISTEMA (área `cadastro`): usa `body.companyId` (pode ser nulo/omitido; não se confirma que a empresa exista nem esteja aprovada —
