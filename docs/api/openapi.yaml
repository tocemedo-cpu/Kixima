  /api/purchase-orders/{id}/accept:
    patch:
      operationId: poAceitar
      tags:
      - Ordens de compra
      summary: Fornecedor aceita a PO (gera a fatura e inicia o prazo de 7 dias)
      description: |
        Só o fornecedor da PO (`po.supplierCompanyId === req.user.companyId`; 403 caso contrário) e só a partir de `APROVADA` (409 caso contrário).

        **PO normal:** numa única transacção — (1) PO passa a `AGUARDANDO_PAGAMENTO` com `acceptedAt` e `paymentDueAt = acceptedAt + PAYMENT_SLA_DAYS` (por omissão **7 dias**, variável de ambiente `PAYMENT_SLA_DAYS`); (2) cria `Invoice` `FAT-AAAA-NNNNNN` (`nextReference`, fora da transacção) com `amount` = total com IVA, `netAmount`, `taxAmount` (14 %), `withholdingAmount`, `dueAt = paymentDueAt`, `status=PENDENTE` e `lines` copiadas dos itens (`NOR`); (3) se o fornecedor tem `Company.serieFiscal`, `faturacaoService.atribuir` reserva série+ano+número sequencial com `SELECT ... FOR UPDATE` e calcula `hashDocumento` (SHA-256/base64 encadeado com `hashAnterior`) — se a transacção falhar o número volta atrás; sem `serieFiscal` a fatura sai SEM numeração certificada; (4) atribui `referenciaPagamento` única (`KXXXX-XXXX`) para a conciliação bancária. A data de emissão anterior a `dataAdesaoFacturacaoElectronica` é recusada (Error genérico => 500).

        **Call-off:** passa directamente a `EM_EXECUCAO`, sem fatura individual nem prazo de 7 dias (faturação consolidada em `/api/contracts/{id}/consolidate-billing`).

        Depois do commit: notificação `faturaGerada`; evento `invoice.issued` (eventId `invoice-issued:<invoiceId>`); submissão síncrona e silenciosa do FT à Sandbox AGT (`agtSandboxSubmissionService.submeter('FT', ...)`, não bloqueia nem falha o pedido); auditoria `PO_ACEITE`. O prazo de 7 dias NÃO é aplicado por nenhum job (ver Resumo/Achados).

        Concorrência: duas aceitações simultâneas — a segunda rebenta em `Invoice.purchaseOrderId` único (409 `UNIQUE_CONSTRAINT`) e o número fiscal reverte com a transacção. Mas `refuse` concorrente pode sobrepor-se (ver achados).

        Código: backend/src/routes/poRoutes.js:25 -> controllers/poController.js:70 `accept` -> services/poService.js:517 `acceptPurchaseOrder` (+ services/faturacaoService.js:146 `atribuir`)
