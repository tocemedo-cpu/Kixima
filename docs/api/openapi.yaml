openapi: 3.0.3
info:
  title: KIXIMA API
  version: 0.1.0
  description: |
    Documentação gerada por **análise estática do código** do backend Node (`backend/src`), sem executar a API nem ligar a qualquer base de dados. Cada operação indica no campo `description` o ficheiro e a linha do handler e do service principal.

    - **Autenticação:** cookie httpOnly `kixima_sessao` (preferido) ou `Authorization: Bearer`. Ver `docs/api/02-autenticacao-e-permissoes.md`.
    - **Papéis:** `COMPRADOR`, `COMPANY_ADMIN`, `FORNECEDOR`, `FINANCEIRO`, `ADMIN_SISTEMA` (com áreas `cadastro`, `financeiro`, `faturacao`, `apolices`, `suporte`, `operacoes`; lista vazia = Super Admin). Cada operação traz `x-permissoes`.
    - **Erros:** envelope `{ "error": { "code", "message", "details?" } }`. Ver `docs/api/04-erros.md`.
    - **Extensões usadas:** `x-permissoes` (papéis, áreas e restrições de posse verificadas no service), `x-limitador` (rate limit aplicável), `x-exemplo` (pedido curl fictício).
    - **Atenção:** os campos `Decimal` do Prisma serializam-se como string. Os achados e lacunas conhecidos estão em `docs/api/07-seguranca.md` e `docs/api/08-funcionalidades-incompletas.md`.
servers:
- url: /
  description: 'Mesma origem do frontend: o backend Node serve também o SPA e a API em `/api/*`.'
- url: http://localhost:4000
  description: Desenvolvimento local (porta por omissão `PORT=4000`).
