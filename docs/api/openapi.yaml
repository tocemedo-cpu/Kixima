              schema:
                $ref: '#/components/schemas/D_ErroApiV1'
              example:
                error:
                  code: RATE_LIMIT
                  message: Demasiados pedidos. O limite é de 120 por minuto por chave.
        '500':
          $ref: '#/components/responses/ErroInterno'
      x-exemplo: 'curl -X PATCH -H ''Authorization: Bearer kxm_<prefixo>.<segredo>'' -H ''Content-Type: application/json''
        -d ''{"preco":92500,"stock":35}'' https://api.exemplo.ao/api/v1/catalogo/VLV-001'
  /api/webhooks/pagamento/{canal}:
    post:
      operationId: webhookPagamentoCanal
      tags:
      - Webhooks de pagamento
      summary: Callback de um gateway de pagamento automático (subscrições)
      description: |
        Endpoint PÚBLICO por desenho (fora de `authenticate`): quem chama é o gateway (EMIS Multicaixa, PayPay, BAI, BFA, Standard Bank Angola), não um utilizador. SERVE APENAS COBRANÇAS DE SUBSCRIÇÃO (`PlanoCobranca`), não faturas de PO.

        **Não há verificação de assinatura/HMAC nem segredo partilhado neste endpoint** (o `rawBody` guardado em `app.js` é usado por outro router, não aqui). A autenticidade assenta em "nunca acreditar no corpo": cada adaptador lê só `id` ou `transactionId` do corpo e volta a perguntar ao gateway (`GET <base>/transactions/{id}` ou `/payments/{id}` com Bearer da plataforma) pelo estado real; só `ACCEPTED` (EMIS) ou `PAID`/`COMPLETED` (PayPay/bancos) conta como pago. Os adaptadores PayPay/banco são declarados como PLACEHOLDER por confirmar contra documentação real.

        Fluxo: `canal` (maiúsculas) desconhecido => 404 `CANAL_DESCONHECIDO`; `confirmarCallback` (sem credenciais do canal configuradas, sem id no corpo ou gateway inalcançável lança `Error` simples => 500 `INTERNAL_ERROR` + Sentry); não pago => 200 `{recebido:true}` sem alterar nada; pago => procura `PlanoCobranca` por `(canal, referenciaExterna = idTransacao)` (404 `COBRANCA_NAO_ENCONTRADA` se não houver) e chama `assinaturaService.confirmarViaGateway`: cobrança `CONFIRMADA` => devolve sem fazer nada (idempotência POR ESTADO); `CANCELADA` => 409; canal/referência diferentes => 409; senão, numa transacção, activa o plano (`Company.plan`, `searchRank`, `planoValidoAte`), regista auditoria `SUBSCRICAO_CONFIRMADA` com actor "Pagamento automático (<canal>)" e notifica COMPANY_ADMIN e FINANCEIRO.

        NÃO valida o montante nem a moeda devolvidos pelo gateway (`verificado.montante` e `referencia` são lidos e ignorados) contra `PlanoCobranca.valorUsd`. A idempotência é por leitura-antes-de-escrita (sem transacção/`updateMany` condicional): dois callbacks simultâneos podem ambos aplicar a confirmação (auditoria e notificação duplicadas). O adaptador Multicaixa recusa moeda diferente de AOA, mas `iniciarPagamentoGateway` pede sempre em USD — o canal EMIS não consegue iniciar subscrições (não confirmado em execução).

        Responde sempre 200 `{recebido:true}` para o gateway não reenviar em loop quando o pagamento não está concluído.

        Código: backend/src/routes/webhookPagamentoRoutes.js:15 (montado em app.js:200) -> services/canaisPagamentoService.js:14 `adaptador`, services/assinaturaService.js:602 `confirmarViaGateway`
      security: []
      x-permissoes:
        papeis: []
        areas: []
        restricoes: Público. Sem assinatura/HMAC, sem lista de IP. Só protegido por `apiLimiter` (600/15 min por
          IP) e pela reconfirmação junto do gateway.
      x-limitador: apiLimiter (600/15 min por IP)
      parameters:
      - name: canal
        in: path
        required: true
        description: Canal (case-insensitive; convertido para maiúsculas).
        schema:
          type: string
          enum:
          - EMIS_MULTICAIXA
          - PAYPAY
          - BAI
          - BFA
          - STANDARD_BANK_ANGOLA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Corpo definido pelo gateway; só `id` ou `transactionId` é lido (o resto é ignorado).
              properties:
                id:
                  type: string
                  description: Identificador da transacção no gateway.
                transactionId:
                  type: string
                  description: Alternativa a `id`.
            example:
              transactionId: TX-20260310-0099
      responses:
        '200':
          description: Recebido (pago e confirmado, já confirmado antes, ou não pago).
          content:
            application/json:
              schema:
                type: object
                properties:
                  recebido:
                    type: boolean
        '404':
          description: Canal desconhecido ou cobrança não encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                canal:
                  value:
                    error:
                      code: CANAL_DESCONHECIDO
                      message: 'Canal desconhecido: XPTO.'
                cobranca:
                  value:
                    error:
                      code: COBRANCA_NAO_ENCONTRADA
                      message: Nenhuma cobrança de subscrição corresponde à transação TX-1.
        '409':
          description: Cobrança cancelada ou callback não corresponde ao pagamento iniciado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErroInterno'
      x-exemplo: |
        curl -X POST https://api.exemplo.ao/api/webhooks/pagamento/PAYPAY -H 'Content-Type: application/json' -d '{"transactionId":"TX-20260310-0099"}'
  /health:
    get:
      operationId: infraHealth
      tags:
      - Infraestrutura
      summary: 'Liveness: o processo está de pé'
      description: |-
        Sonda de vida. Não toca na base de dados. Pública por desenho (orquestrador/Render). Está montada ANTES do `apiLimiter`, por isso não tem limite de pedidos. Devolve o nome do ambiente (`config.env`), o que revela se é production/development.

        Código: backend/src/app.js:115 (handler inline)
      security: []
      responses:
        '200':
          description: Processo vivo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  env:
                    type: string
                    example: production
              example:
                status: ok
                env: production
      x-exemplo: curl -s https://kixima.example/health
  /ready:
    get:
      operationId: infraReady
      tags:
      - Infraestrutura
      summary: 'Readiness: a base de dados responde'
      description: |-
        Executa `SELECT 1` com timeout de 3 s. Pública e sem limitador (montada antes do `apiLimiter`): cada pedido anónimo gera uma ida à base. Em falha devolve 503 com um corpo FORA do envelope de erro padrão (`status`, `database`, `detail`, `latencyMs`) e `detail` traz a mensagem crua do erro (p.ex. do Prisma/timeout).

        Código: backend/src/app.js:120-138 (handler inline; prisma.$queryRaw)
      security: []
      responses:
        '200':
          description: Base de dados acessível.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  database:
                    type: string
                    example: ok
                  latencyMs:
                    type: integer
                  env:
                    type: string
              example:
                status: ok
                database: ok
                latencyMs: 12
                env: production
        '503':
          description: Base de dados inacessível ou timeout (3 s). Corpo próprio, não é o envelope `Erro`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: degradado
                  database:
                    type: string
                    example: inacessivel
                  detail:
                    type: string
                    description: err.message cru.
                  latencyMs:
                    type: integer
              example:
                status: degradado
                database: inacessivel
                detail: timeout ao contactar a base de dados
                latencyMs: 3001
