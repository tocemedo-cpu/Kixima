  /api/companies/register:
    post:
      operationId: empresaRegistar
      tags:
      - Empresas
      summary: Cadastro público de empresa (onboarding) com documentos
      description: |
        Endpoint PÚBLICO (por desenho: é o onboarding — a empresa ainda não tem conta). Recebe `multipart/form-data`
        com os dados da empresa, do primeiro utilizador (Company Admin) e os documentos de credenciamento.

        Regras de negócio (`companyService.registerCompany`):
        1. Documentos obrigatórios por tipo de empresa: CLIENTE = CERTIDAO_COMERCIAL + ALVARA_COMERCIAL; FORNECEDOR =
           ALVARA_COMERCIAL + LICENCA_ANPG + CERTIDAO_COMERCIAL. Falta -> 400 `BUSINESS_RULE_VIOLATION`
           ("Documentos obrigatórios em falta: ...").
        2. FORNECEDOR: apólice Fornecedor->KIXIMA obrigatória (`policyNumber`, `insurer`, `coverageAmount`,
           `policyValidFrom`, `policyValidUntil` + ficheiro `APOLICE_SEGURO`), senão 400. Para CLIENTE, os campos de
           apólice e o ficheiro `APOLICE_SEGURO` são ignorados.
        3. Unicidade: NIF (`taxId`) e email do admin já existentes -> 409 `CONFLICT` (mensagens distintas, logo permite
           enumerar NIFs/emails registados; mitigado só pelo limitador).
        4. Ficheiros guardados via `storageService.saveFile` (verifica os bytes reais contra o mimetype — `fileSignature`)
           ANTES da transacção na BD; se a transacção falhar ficam ficheiros órfãos.
        5. Transacção: cria `Company` (status `PENDENTE`, `termsAcceptedAt`), `User` COMPANY_ADMIN (activo, `passwordHash` bcrypt 12),
           `CompanyDocument` por documento e, se FORNECEDOR, `SupplierToKiximaPolicy` (status `SUBMETIDA`, moeda por omissão AOA).
        6. Dimensão: `size` classificada automaticamente (`planService.classify`); `plan` = `PRO` se o cliente pediu PRO ou se a
           dimensão for GRANDE, caso contrário `BASICO` (alias de CORE). NÃO exige pagamento: ver achados (PRO gratuito).
        7. Não envia notificação aos administradores KIXIMA nem confirmação ao registante (nenhum evento é chamado).
        A empresa só consegue iniciar sessão depois de aprovada (`PATCH /api/companies/{id}/decision`); o login recusa empresas não APROVADAS.

        Limitadores: `sensitiveLimiter` (30/15 min por IP) + `apiLimiter` global.

        Código: backend/src/routes/companyRoutes.js:33 -> backend/src/controllers/companyController.js:16 -> backend/src/services/companyService.js:40
