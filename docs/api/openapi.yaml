      - cookieAuth: []
      - bearerAuth: []
      x-permissoes:
        papeis:
        - ADMIN_SISTEMA
        areas:
        - suporte
        restricoes: Visão global; qualquer assessor com a área suporte pode criar empresas fornecedoras (sem exigir
          cadastro).
      parameters:
      - name: id
