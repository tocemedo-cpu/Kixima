    post:
      operationId: contratoConsolidarFaturacao
      tags:
      - Contratos-quadro
      summary: Consolidar a faturação das call-offs de um contrato
      description: |
        Agrega todas as call-offs do contrato com `consolidatedInvoiceId = null` e estado `ENTREGUE`, `RECEBIDA_CONFORME`, `EM_EXECUCAO` ou `APROVADA` (inclui call-offs ainda não aceites pelo fornecedor) numa única fatura `FAT-AAAA-NNNNNN` com IVA por linha, `dueAt = hoje + contract.paymentTermDays`, `contractId`, `consolidatedPoIds`. Sem call-offs pendentes => 400 `Não há call-offs pendentes de faturação para este contrato.`

        Numa transacção: numeração certificada da série do FORNECEDOR do contrato (se tiver `serieFiscal`) com hash, `Invoice` (+ `lines`), `updateMany` nas POs (`paymentDueAt`, `consolidatedInvoiceId`) e `referenciaPagamento`. Depois: notificação IN_APP_EMAIL ao FINANCEIRO do cliente e submissão silenciosa do FT à Sandbox AGT. Sem auditoria nem evento ERP.

        Autorização: ADMIN_SISTEMA (área `financeiro`), FINANCEIRO ou COMPANY_ADMIN de qualquer das duas empresas — ou seja, o COMPRADOR pode forçar a emissão de uma fatura fiscal na série do fornecedor. Outra empresa recebe 404. Não valida estado/validade do contrato nem a periodicidade (`billingPeriodicity` não é aplicada).

        Concorrência: a selecção das call-offs pendentes é feita fora da transacção e o `updateMany` não exige `consolidatedInvoiceId = null`; dois pedidos simultâneos podem emitir DUAS faturas para as mesmas call-offs (ver achados). A selecção está sujeita ao tecto de 1000 linhas do Prisma extension.

