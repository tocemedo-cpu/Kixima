                        type: string
                      name:
                        type: string
                      email:
                        type: string
                      active:
                        type: boolean
                  registosDeAuditoriaPreservados:
                    type: integer
                  notificacoesEliminadas:
                    type: integer
                  motivo:
                    type: string
                    nullable: true
                  anonimizadoEm:
                    type: string
                    format: date-time
                  nota:
                    type: string
        '400':
          description: Já anonimizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error:
                  code: BUSINESS_RULE_VIOLATION
                  message: Esta conta já foi anonimizada.
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '422':
