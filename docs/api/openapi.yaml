  responses:
    NaoAutenticado:
      description: Sessão em falta, token inválido/expirado ou sessão revogada (tokenVersion).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            error:
              code: UNAUTHORIZED
              message: Sessão em falta. Inicie sessão para continuar.
    SemPermissao:
      description: Papel/área insuficiente, ou sessão restrita por 2FA obrigatória pendente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            error:
              code: FORBIDDEN
              message: Sem permissão para esta ação.
    NaoEncontrado:
      description: Recurso inexistente (ou de outra empresa, quando o service filtra por posse).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            error:
              code: NOT_FOUND
              message: Recurso não encontrado.
    DadosInvalidos:
      description: Validação Zod falhou; `details` traz o `flatten()` do erro.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            error:
              code: VALIDATION_ERROR
              message: Dados inválidos.
    RegraNegocio:
      description: Regra de negócio violada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            error:
              code: BUSINESS_RULE_VIOLATION
              message: Operação não permitida no estado actual.
    Conflito:
      description: Conflito de estado ou violação de unicidade (`CONFLICT` / `UNIQUE_CONSTRAINT`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            error:
              code: CONFLICT
              message: Conflito com o estado actual do recurso.
    LimiteExcedido:
      description: Rate limit excedido (`RATE_LIMITED`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            error:
              code: RATE_LIMITED
              message: Demasiados pedidos. Tente novamente mais tarde.
    ServicoIndisponivel:
      description: Dependência externa indisponível ou não configurada (`SERVICO_INDISPONIVEL`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            error:
              code: SERVICO_INDISPONIVEL
              message: Serviço indisponível.
    ErroInterno:
      description: Erro não previsto (`INTERNAL_ERROR`). A mensagem é genérica.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            error:
              code: INTERNAL_ERROR
              message: Erro interno do servidor.
