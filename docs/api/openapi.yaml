        Regra de isolamento: se o utilizador é `COMPRADOR`, o controller acrescenta `excludeSupplierId = companyId` e a empresa do comprador deixa de aparecer. Efeito colateral conhecido: esse filtro substitui (no `where`) o filtro `supplierId`, por isso um COMPRADOR não consegue filtrar por fornecedor através deste endpoint. Não é filtrado o estado do fornecedor (APROVADA/SUSPENSA) nem a propriedade (qualquer papel autenticado vê todos os produtos activos). O corpo inclui todos os campos escalares de `Product` (incluindo campos internos como `minStock`, `warehouse`, `supplierNotes`, `viewCount`).

