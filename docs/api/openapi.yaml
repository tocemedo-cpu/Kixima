  /api/uploads/{filename}:
    get:
      operationId: uploadsObter
      tags:
      - Ficheiros
      summary: Descarrega um ficheiro carregado (modo de armazenamento local)
      description: |-
        Serve ficheiros da pasta `uploads/` do contentor, só quando STORAGE_PROVIDER=local. Em modo `s3` (obrigatório em produção, config/env.js:450) os URLs guardados apontam directamente para o bucket e ESTE endpoint não é usado — ver achado crítico no .md: nesse modo não há verificação de posse.

        Autenticação OPCIONAL (`optionalAuthenticate`): sem sessão, só ficheiros públicos; com sessão aplica-se a regra de posse. Regras (services/uploadAccessService.js:81-120), por ordem:
        1. PÚBLICO (qualquer pedido, até anónimo): URL referenciado por `Product.imageUrl`, `ProductImage.url`, `ProductDocument.fileUrl`, `User.avatarUrl` ou `SupportCategoryImage.imageUrl`. Cache-Control: public, max-age=31536000, immutable.
        2. ADMIN_SISTEMA: acede a tudo.
        3. Sem sessão e não público: 401 `UNAUTHORIZED` (corpo próprio).
        4. PRIVADO por empresa: `CompanyDocument.fileUrl`, `PlanoCobranca.comprovativoUrl`, `AddonCobranca.comprovativoUrl` -> só a empresa dona.
        5. Comprovativo de pagamento (`Payment.proofUrl`): empresa compradora OU fornecedora da ordem/contrato da fatura.
        6. Anexo de suporte (`SupportMessage.attachmentUrl`) -> quem tem acesso ao ticket (supportChatService.ticketComAcesso); anexo de conversa (`ConversationMessage.attachmentUrl`) -> participante (conversationService.conversationComAcesso).
        7. Qualquer outro ficheiro (inclui o documento de apólice `SupplierToKiximaPolicy.documentUrl`, que não está nesta lista) -> negado por omissão (404 a quem tem sessão).

        O nome tem de cumprir `^[a-z0-9-]+\.[a-z0-9]+$` (case-insensitive), senão 404 imediato. O Content-Type vem da assinatura (magic bytes) do ficheiro, não da extensão: PNG/JPEG/GIF/WEBP/PDF/XLSX, senão `application/octet-stream`. Cabeçalhos: `Content-Disposition: inline; filename="..."`; privados `Cache-Control: private, no-store`.

        IMPORTANTE: está montado antes do `apiLimiter` (app.js:108 vs 142) e cada pedido faz até 5 consultas à base para decidir público/privado, sem limite nem cache. 404 e não 403 para utilizador autenticado sem posse (não confirma a existência).

        Código: backend/src/routes/uploadsRoutes.js:35-65; services/uploadAccessService.js:81 (resolverAcesso); services/storageService.js:lerFicheiro
      security:
      - {}
      - cookieAuth: []
      - bearerAuth: []
      x-permissoes:
        papeis:
        - anónimo (só públicos)
        - COMPRADOR
        - COMPANY_ADMIN
        - FORNECEDOR
        - FINANCEIRO
        - ADMIN_SISTEMA (tudo)
        areas: []
        restricoes: 'Posse verificada no service pelo registo da base que referencia o URL (empresa dona; empresas
          da transação; participantes do ticket/conversa). Sessão com 2FA obrigatória em falta (mfaRestrita) NÃO
          é bloqueada aqui: ver achado no .md.'
      x-limitador: nenhum (montado antes do apiLimiter)
      parameters:
      - name: filename
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-zA-Z0-9-]+\.[a-zA-Z0-9]+$
        description: 'Nome gerado pelo servidor: `<keyHint>-<Date.now()>.<ext>` (storageService.buildFilename).'
      responses:
        '200':
          description: Conteúdo binário do ficheiro.
          headers:
            Content-Type:
              schema:
                type: string
              description: Detectado pelos magic bytes.
            Content-Disposition:
              schema:
                type: string
                example: inline; filename="avatar-xxxx-1700000000000.jpg"
            Cache-Control:
              schema:
                type: string
              description: public, max-age=31536000, immutable (público) | private, no-store (privado).
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          description: 'Sem sessão e o ficheiro não é público (inclui nomes que não existem: não há oráculo de existência
            para anónimos).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error:
                  code: UNAUTHORIZED
                  message: Inicie sessão para aceder a este ficheiro.
        '404':
          description: Nome inválido, ficheiro inexistente/ausente do disco, ou utilizador autenticado sem posse.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
