        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                notas:
                  type: string
                  description: Nota interna opcional guardada em `PlanoCobranca.notas`. Sem validação de tipo nem
