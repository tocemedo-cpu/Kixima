    post:
      operationId: catalogoImportarExcel
      tags:
      - Catálogo
      summary: Importa catálogo em massa a partir de Excel (.xlsx)
      description: |-
        O fornecedor carrega uma folha de cálculo no formato KIXIMA (folha "Catálogo"/"catalogo"/"catalog"/"produtos"/"itens"; a primeira folha serve de alternativa) e os produtos são **criados ou actualizados** na empresa do utilizador (`companyId` da sessão).

        Exige o recurso de plano `carregamentoEmMassa` (apenas PRO; `planService.assertFeature`, que também bloqueia se a subscrição estiver RESTRITA). Colunas obrigatórias: "Categoria" e "Produto/Serviço" (com vários aliases de cabeçalho). Opcionais: descrição, tipo (começa por "serv" => SERVICO), UOM, código UNSPSC, título/segmento/família UNSPSC, país de origem, preço, stock, cidade. A leitura do Excel corre num worker isolado (`xlsxSeguro`, limite de 30 s e 256 MB) por causa de vulnerabilidades conhecidas da biblioteca `xlsx`.

        Comportamento a ter em conta (confirmado no código):
        - **Idempotência por slug** `slug = <nome-slugificado>-<código|índice da linha>-<8 primeiros caracteres do id da empresa>`: se o slug existe faz `update` com TODOS os campos da linha, senão `create`. Numa re-importação, campos ausentes da folha são repostos a valores por omissão (preço estimado por categoria, stock 50, disponibilidade "Em stock", prazo 15/5 dias, cidade Luanda, `active = true`), o que pode **sobrescrever preços/stock reais** e **reactivar** produtos desactivados.
        - **Preço**: se a coluna de preço não existir ou a célula for inválida, é atribuído um preço inventado (`defaultPrice`, derivado da categoria e dos 3 últimos dígitos do código) — contado em `precosEstimados`. Preços numéricos negativos ou zero vindos da folha não são rejeitados (`parsePrice`).
        - Imagens embebidas (xl/media) são associadas às linhas **por posição**; se o n.º de imagens difere do n.º de linhas é devolvido um aviso em `warnings`. Cada imagem passa por `storageService.saveFile` (verificação de assinatura só para png/jpeg/gif/webp/pdf).
        - Não exige que a empresa seja FORNECEDOR nem que esteja APROVADA (ao contrário de `POST /api/catalog`).
        - Cada linha falha isoladamente; as falhas são devolvidas em `errors[]` com `e.message` (pode ser mensagem crua do Prisma). Sem limite de número de linhas, só de 25 MB de ficheiro.
        - Não regista auditoria (o controller não chama `auditService`).

        Código: backend/src/routes/catalogRoutes.js:43 -> catalogController.importCatalog (controllers/catalogController.js:152) -> catalogImportService.importCatalog (services/catalogImportService.js:134); upload: config/upload.js:72-82
