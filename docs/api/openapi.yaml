  /api/reports/conteudo-local:
    get:
      operationId: relatorioConteudoLocal
      tags:
      - Relatórios
      summary: Relatório de conteúdo local da empresa compradora (plano PRO)
      description: |
        Gera o relatório de conteúdo local (contratação nacional, origem do bem, MPME angolana) das compras **da empresa do utilizador** (`buyerCompanyId = req.user.companyId`) num período.
        Não existe modelo oficial da ANPG; é um desenho proposto (comentário em `conteudoLocalService.js:10`).

        Regras de negócio:
        - Funcionalidade do plano **PRO** (`relatorioConteudoLocal`, `planService.js:200,219,238`). `planService.assertFeature` devolve 400 `PLANO_INSUFICIENTE` se o plano não a inclui, ou se a subscrição está vencida há mais do que o período de tolerância (estado `RESTRITA`).
        - Só entram POs com compromisso real: `ACEITE_FORNECEDOR, AGUARDANDO_PAGAMENTO, PAGA, EM_EXECUCAO, ENTREGUE, RECEBIDA_CONFORME, RECEBIDA_COM_DIVERGENCIA, CONCLUIDA`, filtradas por `createdAt` entre `de` e `ate` (o dia de `ate` entra por inteiro, até 23:59:59.999 UTC).
        - Valores sem IVA (`netAmount`, com fallback para `totalAmount`). Linhas sem país de origem **não** contam como angolanas; `qualidadeDosDados.confiavel` é `false` se >10 % do valor não tiver origem declarada.
        - `de` por omissão = 1 de Janeiro do ano UTC corrente; `ate` por omissão = agora. As datas são lidas com `new Date(...)` (aceita qualquer texto que o JS interprete; a mensagem de erro fala em AAAA-MM-DD). Datas inválidas ou `de > ate` → 400 `BUSINESS_RULE_VIOLATION`.
        - Isolamento entre empresas: a consulta filtra sempre por `buyerCompanyId` da sessão. O relatório expõe, por fornecedor com quem a empresa tem POs, `nome`, `NIF`, `país`, `província` e `dimensão` (dados de contraparte, não de outra empresa-cliente).
        - Formato: apenas JSON (não há CSV/PDF). Sem paginação nem limite de período: o `anexo` traz as POs do período. **Limite silencioso**: o `findMany` de POs não tem `take`, por isso fica cortado a 1000 POs (`DB_MAX_ROWS`, `config/database.js:29,42-45`) — acima disso todos os totais e percentagens do relatório ficam subavaliados, apenas com um erro no log (relevante: é um relatório de cariz regulatório).
        - Sem efeitos secundários nem auditoria (leitura).

        Código: backend/src/routes/reportsRoutes.js:26 → backend/src/services/conteudoLocalService.js:100 (`gerar`)
