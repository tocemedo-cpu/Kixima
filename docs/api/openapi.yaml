    post:
      operationId: catalogoMovimentoCriar
      tags:
      - Catálogo - Inventário
      summary: Regista entrada/saída de stock
      description: |-
        Regista um movimento de inventário e ajusta `stockQuantity` do produto numa transacção (`ENTRADA` soma, `SAIDA` subtrai).

        Regras: o produto tem de pertencer à empresa (senão 404, sem revelar se existe). A quantidade é um inteiro positivo (`z.coerce.number().int().positive()`, sem máximo). O novo stock é `max(0, atual + delta)`: uma saída superior ao stock **não é rejeitada**, o stock fica a 0 e o movimento fica registado com a quantidade integral pedida (o livro de movimentos deixa de bater com o stock). O stock actual é lido antes da transacção (leitura-modificação-escrita não atómica: dois movimentos concorrentes podem perder uma actualização). Efeito secundário: se o stock passa de acima do mínimo (`minStock`) para igual/abaixo, é enviada a notificação interna `ESTOQUE_BAIXO` aos utilizadores FORNECEDOR/COMPANY_ADMIN da empresa. Auditoria: `CATALOGO_MOVIMENTO_CRIADO`.

        Código: backend/src/routes/catalogRoutes.js:48 -> catalogController.createMovement (controllers/catalogController.js:118) -> catalogService.createStockMovement (services/catalogService.js:345); schema utils/schemas.js:334
