        por utilizador)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - categoria
              - rating
              - message
              properties:
                categoria:
                  type: string
                  enum:
                  - FORNECEDOR
                  - PRODUTO
                  - SERVICO
                  - PEDIDO
                  - ENTREGA
                  - PAGAMENTO
                  - ATENDIMENTO
                  - EXPERIENCIA_GERAL
                targetId:
                  type: string
                  description: Obrigatório salvo EXPERIENCIA_GERAL. Id de empresa (FORNECEDOR), produto (PRODUTO/SERVICO),
                    ordem (PEDIDO/ENTREGA), pagamento (PAGAMENTO) ou ticket (ATENDIMENTO).
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                message:
                  type: string
                  minLength: 1
                  maxLength: 700
                  description: Excesso é cortado sem erro.
            example:
              categoria: PEDIDO
              targetId: 00000000-0000-0000-0000-000000000022
              rating: 5
              message: Entrega dentro do prazo.
      responses:
        '201':
          description: Recebida (fica por moderar).
          content:
            application/json:
              schema:
                type: object
                properties:
                  recebido:
                    type: boolean
                  id:
                    type: string
              example:
                recebido: true
                id: 00000000-0000-0000-0000-000000000009
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '422':
          description: Regras do service (categoria, rating, comentário, alvo fora do histórico, sem empresa).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Não encontrámos esse registo no histórico da sua empresa.
        '429':
          description: Mais de 10 envios por IP em 15 min.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error:
                  code: RATE_LIMITED
                  message: Demasiados envios. Tente novamente mais tarde.
