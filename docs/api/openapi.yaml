  /api/purchase-orders:
    post:
      operationId: poCriar
      tags:
      - Ordens de compra
      summary: Emitir uma ordem de compra (checkout)
      description: |
        O comprador emite uma PO a um único fornecedor. O servidor recalcula tudo: preço unitário vem do produto (o cliente só envia `productId` e `quantity`), o IVA (14 %, `IVA_RATE`) é somado por `taxService.summarize` e `totalAmount` é o total COM IVA (= `gross`); `netAmount`, `taxAmount` e `withholdingAmount` (retenção 6,5 % só em serviços) ficam guardados à parte.

        Regras: pelo menos 1 item; o fornecedor não pode ser a própria empresa (400); todos os produtos têm de existir (404 `Um ou mais produtos não encontrado.` — também dispara se o mesmo `productId` vier repetido em duas linhas, porque a comparação é por contagem) e pertencer ao fornecedor indicado (400). Produtos com `stockQuantity` não nulo têm o stock verificado e decrementado atomicamente (`updateMany ... stockQuantity >= quantidade`) na mesma transacção que cria a PO; sem stock devolve 400 `Stock insuficiente para "X": pediu N, há M em stock.`

        Estado inicial: `AGUARDANDO_APROVACAO`. Excepções: (a) **Call-off** — se existir contrato-quadro ATIVO e válido entre as duas empresas que cubra TODAS as categorias dos itens, a PO nasce `APROVADA` (`isCallOff=true`, `approvedAt` preenchido, sem `approvedById`), `Contract.usedValue` é incrementado com o valor líquido e o fornecedor é notificado; (b) **ERP gerido** — se o plano do comprador inclui `erpIntegration` e há ERP real configurado, `erpManaged=true`, a PO fica `AGUARDANDO_APROVACAO`, publica-se `purchase_order.approval_requested` no barramento e grava-se `ErpSyncLog`; a decisão só chega por callback do ERP.

        Efeitos secundários: notificação `poAguardaAprovacao` ao Company Admin (caso normal), aviso de stock baixo na transição, auditoria `PO_CRIADA` (`recordSafe`, não bloqueia). NÃO há verificação de tecto do contrato-quadro (`totalValue`), de orçamento (`BudgetLimit`) nem de `approvalCap` do utilizador.

        Código: backend/src/routes/poRoutes.js:13 -> controllers/poController.js:4 `create` -> services/poService.js:38 `createPurchaseOrder`
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-permissoes:
        papeis:
        - COMPRADOR
        - COMPANY_ADMIN
        areas: []
        restricoes: A PO é sempre criada em nome de `req.user.companyId` (empresa compradora). Não há verificação
          de que o fornecedor está activo/credenciado nem de que o produto está publicado.
      x-limitador: apiLimiter (600/15 min por utilizador ou IP)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - supplierCompanyId
              - items
              properties:
                supplierCompanyId:
                  type: string
                  format: uuid
                items:
                  type: array
                  minItems: 1
                  description: Sem máximo. Não repetir o mesmo productId.
                  items:
                    type: object
                    required:
                    - productId
                    - quantity
                    properties:
                      productId:
                        type: string
                        format: uuid
                      quantity:
                        type: integer
                        minimum: 1
                        description: Inteiro positivo; sem limite superior no schema.
            example:
              supplierCompanyId: 7d4f2a52-1b8e-4f3a-9a55-2b0c9f5e8a11
              items:
              - productId: 3f0b6e2e-5a2a-4d5c-8a0e-6a3a9d3f7c10
                quantity: 20
      responses:
        '201':
          description: PO criada (escalares da PO + `items`). Valores Decimal serializam-se como string.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/E_PurchaseOrder'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/E_PurchaseOrderItem'
        '400':
          description: Regra de negócio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                propriaEmpresa:
                  value:
