  /api/faturacao/saft:
    get:
      operationId: faturacaoSaft
      tags:
      - Faturação
      summary: Descarregar o SAF-T (AO) de uma empresa fornecedora
      description: |
        Gera o XML SAF-T (AO, namespace `urn:OECD:StandardAuditFile-Tax:AO_1.01_01`) das faturas (`InvoiceType FT`) emitidas pela empresa fornecedora com `issuedAt` no intervalo `[de, ate]` (fim do dia incluído) e das notas de crédito (`NC`) cuja data de EMISSÃO cai no intervalo. O fornecedor/Company Admin recebe sempre o da SUA empresa (o `supplierCompanyId` do pedido é ignorado); o ADMIN_SISTEMA tem de indicar `supplierCompanyId` (422 `Indique a empresa fornecedora (supplierCompanyId).`).

        Resposta: `application/xml`, `Content-Disposition: attachment; filename="SAFT-AO-<de>-a-<ate>.xml"`, cabeçalhos `X-Kixima-Documentos` (n.º de faturas) e `X-Kixima-Sem-Serie` (faturas sem série certificada). Numeração: `InvoiceNo` = `serie.ano/0000001` (série interna) ou a referência `FAT-...` se não tiver série; `Hash` = `hashDocumento` interno; fatura totalmente creditada => `InvoiceStatus A`. Limitações assumidas no código: sem tabela de pagamentos/recibos (RC), sem produtos nem taxas em `MasterFiles`, `TotalCredit` só soma faturas, `CurrencyCode` fixo AOA, `SoftwareCertificateNumber` '0' por omissão, máx. 100000 faturas e 100000 NC, não validado contra o XSD oficial. O `InvoiceNo` do SAF-T é a série interna e NÃO o `agtDocumentNo` enviado à AGT.

        Erros: datas ilegíveis ou `ate < de` => 422 (`Indique o período no formato AAAA-MM-DD (de e até).`).

        Código: backend/src/routes/faturacaoRoutes.js:83 -> services/saftService.js:66 `gerar`
