security:
- cookieAuth: []
- bearerAuth: []
paths:
  /api/addons/catalogo:
    get:
      operationId: addonCatalogo
      tags:
      - Add-ons
      summary: Catálogo de add-ons pagos disponíveis
      description: |
        Lista os add-ons que existem para pedir. Hoje só `PO_ROBOT` ("Automatic PO Robot", exige plano `PRO`; preço
        200 USD mensal por omissão, configurável com `KIXIMA_PRECO_ADDON_PO_ROBOT_USD` e
        `KIXIMA_PRECO_ADDON_PO_ROBOT_PERIODO`). O catálogo é constante em memória (não vem da base de dados). Qualquer
        utilizador autenticado pode ver (qualquer papel, incluindo FORNECEDOR). Só leitura.

        Código: backend/src/routes/addonRoutes.js:17 -> backend/src/services/addonService.js:52 (`catalogo`)
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-permissoes:
        papeis:
        - COMPRADOR
        - COMPANY_ADMIN
        - FORNECEDOR
        - FINANCEIRO
        - ADMIN_SISTEMA
        areas: []
        restricoes: Apenas `authenticate`; sem restrição de papel nem empresa.
      x-limitador: apiLimiter (600/15 min por utilizador ou IP)
      responses:
        '200':
          description: Lista de add-ons.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    addonKey:
                      type: string
                      example: PO_ROBOT
                    label:
                      type: string
                      example: Automatic PO Robot
                    requerPlano:
                      type: string
                      example: PRO
                    preco:
                      $ref: '#/components/schemas/F_Preco'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErroInterno'
      x-exemplo: |
        curl -b "kixima_sessao=<jwt>" https://api.exemplo.ao/api/addons/catalogo
  /api/addons/fila:
    get:
      operationId: addonFila
      tags:
      - Add-ons
      summary: Fila da KIXIMA - cobranças de add-on em aberto
      description: |
        Lado KIXIMA. Devolve as cobranças de add-on em `PENDENTE`/`COMPROVATIVO_ENVIADO` de todas as empresas, com
        `company {id,name,plan}`, e as contagens `porConfirmar` e `porPagar`. Ao contrário da fila de subscrição, não
        lista add-ons vencidos. Só leitura.

        Código: backend/src/routes/addonRoutes.js:22 -> backend/src/services/addonService.js:345 (`fila`)
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-permissoes:
        papeis:
        - ADMIN_SISTEMA
        areas:
        - financeiro
        restricoes: Super Admin ou área `financeiro`; sem filtro de empresa.
      x-limitador: apiLimiter (600/15 min por utilizador ou IP)
      responses:
        '200':
          description: Fila de cobranças de add-on.
          content:
            application/json:
              schema:
                type: object
                properties:
                  emAberto:
                    type: array
                    items:
                      allOf:
                      - $ref: '#/components/schemas/F_AddonCobranca'
                      - type: object
                        properties:
                          company:
                            $ref: '#/components/schemas/F_EmpresaResumo'
                  porConfirmar:
                    type: integer
                  porPagar:
                    type: integer
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErroInterno'
      x-exemplo: |
        curl -b "kixima_sessao=<jwt>" https://api.exemplo.ao/api/addons/fila
  /api/addons/{addonKey}/estado:
    get:
      operationId: addonEstado
      tags:
      - Add-ons
      summary: Estado de um add-on para a empresa (activo, validade, cobrança em aberto)
      description: |
        Devolve `ativo` (true só se `CompanyAddon.status=ATIVO` e a validade paga ainda não passou, ou se `validoAte`
        for nulo - add-ons antigos), `activatedAt`, `validoAte`, a cobrança em aberto (a mais recente em
        `PENDENTE`/`COMPROVATIVO_ENVIADO`), `label` e `preco`. `addonKey` desconhecido -> 422 (`ValidationError`). Não
        devolve histórico de cobranças de add-on. Só leitura.

        Código: backend/src/routes/addonRoutes.js:31 -> backend/src/services/addonService.js:66 (`estado`)
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-permissoes:
        papeis:
        - COMPANY_ADMIN
        - FINANCEIRO
        - COMPRADOR
        areas: []
        restricoes: Empresa do token. FORNECEDOR e ADMIN_SISTEMA recebem 403.
      x-limitador: apiLimiter (600/15 min por utilizador ou IP)
      parameters:
      - name: addonKey
        in: path
        required: true
        description: Chave do add-on. Hoje só `PO_ROBOT`.
        schema:
          type: string
          enum:
          - PO_ROBOT
      responses:
        '200':
          description: Estado do add-on.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/F_AddonEstado'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '422':
          description: Add-on desconhecido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: 'Add-on desconhecido: "X". Os add-ons são: PO_ROBOT.'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErroInterno'
      x-exemplo: |
        curl -b "kixima_sessao=<jwt>" https://api.exemplo.ao/api/addons/PO_ROBOT/estado
  /api/addons/{addonKey}/pedir:
    post:
      operationId: addonPedir
      tags:
      - Add-ons
      summary: Pedir um add-on (emite a cobrança; não activa nada)
      description: |
        Emite uma `AddonCobranca` `PENDENTE` (referência `ADD-AAAA-NNNNNN`) com preço, período e meses congelados.
        Verificações no servidor por ordem: `addonKey` conhecido (422); empresa existe (404) e `APROVADA` (400);
        feature gating - a empresa tem de estar no plano exigido pelo add-on (`PO_ROBOT` exige `PRO` ou superior, comparado
        pela escada BASE<CORE<PRO) senão 400 `BUSINESS_RULE_VIOLATION` ("exige o plano PRO ou superior"; é
        `BusinessRuleError`, não `PLANO_INSUFICIENTE`); o add-on não pode estar já activo e dentro da validade
        (409; um add-on vencido pode ser renovado); não pode haver outra cobrança em aberto do mesmo add-on (409,
        garantido também por índice único parcial `addon_cobrancas_company_id_addon_key_aberta_key`).

        Efeitos: auditoria `ADDON_PEDIDO`; sem notificações. Não verifica se a subscrição está `RESTRITA`.

        Código: backend/src/routes/addonRoutes.js:35 -> backend/src/services/addonService.js:106 (`pedir`)
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-permissoes:
        papeis:
        - COMPANY_ADMIN
        areas: []
        restricoes: Empresa do token; plano verificado no servidor (`planSuficiente(company.plan, 'PRO')`).
      x-limitador: apiLimiter (600/15 min por utilizador ou IP)
      parameters:
      - name: addonKey
        in: path
        required: true
        schema:
          type: string
          enum:
          - PO_ROBOT
      responses:
        '201':
          description: Cobrança de add-on emitida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/F_AddonCobranca'
        '400':
          description: Empresa não aprovada ou plano insuficiente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                plano:
                  value:
                    error:
                      code: BUSINESS_RULE_VIOLATION
                      message: '"Automatic PO Robot" exige o plano PRO ou superior.'
                naoAprovada:
                  value:
                    error:
                      code: BUSINESS_RULE_VIOLATION
                      message: A empresa tem de estar aprovada para pedir um add-on.
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: Add-on já activo, ou já existe cobrança em aberto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                jaAtivo:
                  value:
                    error:
                      code: CONFLICT
                      message: O add-on "Automatic PO Robot" já está ativo para esta empresa.
                emAberto:
                  value:
                    error:
                      code: CONFLICT
                      message: Já existe a cobrança ADD-2026-000001 do add-on "Automatic PO Robot" por liquidar
                        (200 USD). Conclua ou cancele essa antes de pedir outra.
        '422':
          description: Add-on desconhecido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErroInterno'
      x-exemplo: |
        curl -X POST -b "kixima_sessao=<jwt>" https://api.exemplo.ao/api/addons/PO_ROBOT/pedir
  /api/addons/{id}/cancelar:
    post:
      operationId: addonCancelar
      tags:
      - Add-ons
      summary: Cancelar uma cobrança de add-on em aberto
      description: |
        Mesma regra de `POST /api/assinatura/{id}/cancelar`: só cobranças em `PENDENTE`/`COMPROVATIVO_ENVIADO`
        passam a `CANCELADA` (409 caso contrário); `motivo` obrigatório (422), guardado em `notas`. `COMPANY_ADMIN`
        só cancela as da sua empresa (403 caso contrário); `ADMIN_SISTEMA` (Super Admin ou área `financeiro`) cancela
        qualquer. Auditoria `ADDON_CANCELADO`; sem notificações. Não desactiva um add-on já confirmado (cancelar só se
        aplica a cobranças em aberto).

        Código: backend/src/routes/addonRoutes.js:52 -> backend/src/services/addonService.js:314 (`cancelar`)
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-permissoes:
        papeis:
        - COMPANY_ADMIN
        - ADMIN_SISTEMA
        areas:
        - financeiro
        restricoes: Para COMPANY_ADMIN, escopo `{companyId}` vindo do token; para ADMIN_SISTEMA, global.
      x-limitador: apiLimiter (600/15 min por utilizador ou IP)
      parameters:
      - name: id
        in: path
        required: true
        description: UUID da cobrança de add-on.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - motivo
              properties:
                motivo:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Cobrança cancelada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/F_AddonCobranca'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          description: Motivo em falta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Indique o motivo do cancelamento.
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErroInterno'
      x-exemplo: |
        curl -X POST -b "kixima_sessao=<jwt>" -H "Content-Type: application/json" -d '{"motivo":"Já não é necessário"}' \
          https://api.exemplo.ao/api/addons/3f1c2d9e-0000-4000-8000-000000000002/cancelar
  /api/addons/{id}/comprovativo:
    post:
      operationId: addonComprovativo
      tags:
      - Add-ons
      summary: Carregar o comprovativo da transferência de uma cobrança de add-on
      description: |
        Igual a `POST /api/assinatura/{id}/comprovativo`, mas para `AddonCobranca` e com o papel `FINANCEIRO` também
        autorizado (incoerente com a subscrição, onde o FINANCEIRO foi excluído).

        Multipart, campo `comprovativo`: PNG/JPEG/WEBP/GIF/PDF até 10 MB (`config/upload.js`), com verificação de bytes
        (assinatura) em `storageService.saveFile`. Cobrança da própria empresa (403 se não), em `PENDENTE` ou
        `COMPROVATIVO_ENVIADO` (409 caso contrário). Ficheiro guardado em `proofs/addon-<referencia>-<timestamp>.<ext>`.
        Efeitos: `COMPROVATIVO_ENVIADO`, `comprovativoUrl`, `submetidoEm`; auditoria `ADDON_COMPROVATIVO_ENVIADO`;
        notificação `SUBSCRICAO_COMPROVATIVO` aos `ADMIN_SISTEMA`.

        Código: backend/src/routes/addonRoutes.js:40 -> backend/src/services/addonService.js:180 (`submeterComprovativo`)
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-permissoes:
        papeis:
        - COMPANY_ADMIN
        - FINANCEIRO
        areas: []
        restricoes: Cobrança da própria empresa (403 `FORBIDDEN`).
      x-limitador: apiLimiter (600/15 min por utilizador ou IP)
      parameters:
      - name: id
        in: path
        required: true
        description: UUID da cobrança de add-on (`AddonCobranca.id`).
        schema:
          type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - comprovativo
              properties:
                comprovativo:
                  type: string
                  format: binary
                  description: PDF, PNG, JPEG, WEBP ou GIF, até 10 MB.
      responses:
        '200':
          description: Cobrança actualizada (`COMPROVATIVO_ENVIADO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/F_AddonCobranca'
        '400':
          description: Campo de ficheiro inesperado (Multer).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
        '413':
          description: Ficheiro maior que 10 MB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error:
                  code: LIMIT_FILE_SIZE
                  message: O ficheiro é demasiado grande. Reduza o tamanho da imagem e tente novamente.
        '422':
          $ref: '#/components/responses/DadosInvalidos'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErroInterno'
      x-exemplo: |
        curl -X POST -b "kixima_sessao=<jwt>" -F "comprovativo=@transferencia.png;type=image/png" \
          https://api.exemplo.ao/api/addons/3f1c2d9e-0000-4000-8000-000000000002/comprovativo
  /api/addons/{id}/confirmar:
    post:
      operationId: addonConfirmar
      tags:
      - Add-ons
      summary: A KIXIMA confirma o pagamento de um add-on e activa-o
      description: |
        Mesmo mecanismo da subscrição. Pré-condições: cobrança existe (404); não `CONFIRMADA` (409); não `CANCELADA`
        (409); tem `comprovativoUrl` (400). Numa transacção: cobrança -> `CONFIRMADA` (`confirmadaEm`, `validoAte`,
        `confirmadaPor`, `notas`) e `CompanyAddon` criado/actualizado por `upsert` com `status=ATIVO`, `activatedAt` e
        `validoAte`; auditoria `ADDON_CONFIRMADO` na mesma transacção. Depois: notificação `SUBSCRICAO_CONFIRMADA`
        aos `COMPANY_ADMIN` e `FINANCEIRO` da empresa.

        `validoAte` = (fim da validade ainda em vigor do add-on, se `aindaValido`, senão agora) + `meses` da cobrança.
        A validade nunca altera o `status` guardado (não há job): é verificada a cada leitura (`aindaValido`).
        Não volta a verificar que a empresa continua em plano PRO no momento da confirmação. Mesma ausência de
        atomicidade que a subscrição (ler estado e actualizar sem condição).

        Código: backend/src/routes/addonRoutes.js:26 -> backend/src/services/addonService.js:292 (`confirmar`), :241 (`aplicarConfirmacao`)
      security:
      - cookieAuth: []
      - bearerAuth: []
      x-permissoes:
        papeis:
        - ADMIN_SISTEMA
        areas:
        - financeiro
        restricoes: Sem filtro de empresa (confirma qualquer cobrança).
      x-limitador: apiLimiter (600/15 min por utilizador ou IP)
      parameters:
      - name: id
        in: path
        required: true
        description: UUID da cobrança de add-on (`AddonCobranca.id`).
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                notas:
                  type: string
                  description: Nota interna opcional (sem validação de tipo/tamanho no router).
      responses:
        '200':
          description: Cobrança confirmada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/F_AddonCobranca'
        '400':
          description: Cobrança sem comprovativo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error:
                  code: BUSINESS_RULE_VIOLATION
                  message: A cobrança ADD-2026-000001 não tem comprovativo. Confirmar sem ele deixaria a plataforma
                    a afirmar um pagamento que ninguém consegue mostrar.
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: Já confirmada ou cancelada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error:
                  code: CONFLICT
                  message: A cobrança ADD-2026-000001 já foi confirmada.
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErroInterno'
      x-exemplo: |
        curl -X POST -b "kixima_sessao=<jwt>" -H "Content-Type: application/json" -d '{"notas":"OK"}' \
          https://api.exemplo.ao/api/addons/3f1c2d9e-0000-4000-8000-000000000002/confirmar
  /api/admin/activities:
    get:
      operationId: adminAtividades
      tags:
      - Administração
      summary: Feed de actividades de todo o sistema (área Operações)
      description: |
        Devolve KPIs globais (contagens de empresas, utilizadores, POs, pagamentos, tickets) e um feed das 60 actividades mais recentes, misturando: 25 POs (por `updatedAt`), 10 empresas, 10 utilizadores, 10 pagamentos, 10 tickets de suporte e 10 apólices.

        Regras de negócio:
        - `requireRole('ADMIN_SISTEMA')` + `requirePermission('operacoes')`: Super Admin (áreas vazias) ou assessor com a área `operacoes`.
        - Visão **global entre empresas por desenho** (nomes de empresas, referências de PO/pagamento, assuntos de tickets). Um assessor só de Operações vê assim dados que pertencem às áreas Financeiro e Suporte.
