# KIXIMA — stack completa para desenvolvimento/demo local.
#
#   docker compose up --build
#
# Frontend em http://localhost:8080 (Nginx -> proxy /api -> backend).
# Backend  em http://localhost:4000.
#
# As credenciais abaixo são apenas para uso local. Em produção, define
# JWT_SECRET e a password da base de dados como variáveis de ambiente reais
# (nunca faças commit delas).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kixima
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kixima}
      POSTGRES_DB: kixima
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kixima -d kixima']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '4000'
      APP_URL: http://localhost:4000
      DATABASE_URL: postgresql://kixima:${DB_PASSWORD:-kixima}@db:5432/kixima
      JWT_SECRET: ${JWT_SECRET:-dev-compose-secret-change-me}
      JWT_EXPIRES_IN: 7d
      PAYMENT_SLA_DAYS: '7'
      POLICY_EXPIRY_ALERT_DAYS: '30'
      EMAIL_PROVIDER: console
      LOG_LEVEL: info
    ports:
      - '4000:4000'

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - '8080:80'

volumes:
  pgdata:
