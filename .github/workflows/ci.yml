name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend-tests:
    name: Backend — Jest + Supertest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kixima
          POSTGRES_PASSWORD: kixima
          POSTGRES_DB: kixima_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kixima -d kixima_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://kixima:kixima@127.0.0.1:5432/kixima_test
      DIRECT_URL: postgresql://kixima:kixima@127.0.0.1:5432/kixima_test
      JWT_SECRET: ci-test-secret
      NODE_ENV: test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npm test

  frontend-build:
    name: Frontend — build Vite
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run i18n:check
      - run: npm run i18n:hardcoded
      - run: npm run build

  e2e:
    name: E2E — percursos e acessibilidade
    runs-on: ubuntu-latest

    # Corre a aplicação a sério: base de dados real, servidor real, browser
    # real. Os testes de API não substituem isto — o que parte em silêncio é a
    # junta entre as duas metades, e a junta só se vê num browser.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kixima
          POSTGRES_PASSWORD: kixima
          POSTGRES_DB: kixima_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kixima -d kixima_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://kixima:kixima@127.0.0.1:5432/kixima_e2e
      DIRECT_URL: postgresql://kixima:kixima@127.0.0.1:5432/kixima_e2e
      JWT_SECRET: ci-e2e-secret-com-comprimento-suficiente-para-passar
      NODE_ENV: development
      PORT: 4000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          # Sem isto o setup-node procura um package-lock.json na RAIZ do
          # repositório e não encontra nenhum (é um monorepo, cada metade tem
          # o seu) — o passo falhava logo aqui, antes de sequer instalar nada.
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend — instalar, migrar e semear
        working-directory: backend
        run: |
          npm ci
          npx prisma migrate deploy
          npm run seed:demo

      - name: Backend — arrancar
        working-directory: backend
        run: |
          node -r dotenv/config src/server.js &
          npx wait-on http://127.0.0.1:4000/health --timeout 60000

      - name: Frontend — instalar e arrancar
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run dev -- --host 127.0.0.1 --port 5173 &
          npx wait-on http://127.0.0.1:5173 --timeout 60000

      - name: Correr os testes
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:5173
        run: npm run e2e

      # O relatório só interessa quando falha — e aí interessa muito: traz o
      # vídeo, o rasto e a captura do momento exato.
      - name: Guardar o relatório quando falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
