name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend-tests:
    name: Backend — Jest + Supertest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kixima
          POSTGRES_PASSWORD: kixima
          POSTGRES_DB: kixima_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kixima -d kixima_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://kixima:kixima@127.0.0.1:5432/kixima_test
      DIRECT_URL: postgresql://kixima:kixima@127.0.0.1:5432/kixima_test
      JWT_SECRET: ci-test-secret
      NODE_ENV: test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npm test

  frontend-build:
    name: Frontend — build Vite
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run i18n:check
      - run: npm run build
