# Android Build — valida que o projeto Capacitor compila para Android.
#
# Complementa o ios-build.yml: aqui o Gradle tem acesso normal à rede (ao
# contrário do sandbox de desenvolvimento, onde dl.google.com está fora da
# lista de anfitriões permitidos pelo proxy) — este workflow confirma de
# facto, num runner real, que React build -> Capacitor sync -> Gradle
# continuam coerentes a cada alteração. Build de debug, sem assinatura de
# release (isso pede um keystore, fora do que se guarda no repositório).
name: Android Build

on:
  push:
    branches: ['**']
    paths:
      - 'frontend/android/**'
      - 'frontend/capacitor.config.json'
      - 'frontend/src/**'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/vite.config.js'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'frontend/android/**'
      - 'frontend/capacitor.config.json'
      - 'frontend/src/**'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
  workflow_dispatch: {}

jobs:
  android-build:
    name: Android — build de debug
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - run: npm ci

      - name: React build
        run: npm run build

      - name: Capacitor sync (android)
        run: npx cap sync android

      - name: Gradle build (debug)
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon
