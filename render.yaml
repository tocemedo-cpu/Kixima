# KIXIMA — Blueprint de deploy (Render) — serviço único via Docker.
# O backend serve a API em /api e o frontend compilado (SPA) na mesma origem,
# por isso não há CORS nem proxy. Usa o Dockerfile da RAIZ, que compila o
# frontend e o backend na mesma imagem (o frontend/dist entra no contentor).
# A base de dados é o teu Supabase (define DATABASE_URL no dashboard — é segredo).
#
# Como usar:
#   1. Sobe este repositório para o GitHub.
#   2. Render -> New -> Blueprint -> aponta para o repo (usa este render.yaml).
#   3. No serviço criado, em Environment, define DATABASE_URL com a connection
#      string do POOLER do Supabase (Session mode, porta 5432, ?sslmode=require).
#      JWT_SECRET é gerado automaticamente.
#   4. Deploy. A imagem Docker compila o frontend e `prisma db push` cria as tabelas.
#
# Para popular dados de exemplo uma vez (opcional), na Shell do serviço:
#   npm run seed:demo   (o workdir da imagem é /app = backend)
services:
  - type: web
    name: kixima
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    # /ready e não /health: o /health só diz que o processo está vivo, e a falha
    # mais provável é a base ficar inacessível. O /ready confirma que a
    # aplicação consegue mesmo servir pedidos antes de receber tráfego.
    healthCheckPath: /ready
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: PAYMENT_SLA_DAYS
        value: "7"
      - key: POLICY_EXPIRY_ALERT_DAYS
        value: "30"
      # Email. RECOMENDADO no Render: provider "brevo" (API HTTP, porta 443) —
      # o Render bloqueia portas SMTP de saída (587/465/25), pelo que o SMTP dá
      # "Connection timeout". Define BREVO_API_KEY (xkeysib-...) no dashboard.
      # EMAIL_FROM tem de ser um remetente VERIFICADO na conta Brevo.
      - key: EMAIL_PROVIDER
        value: brevo
      - key: EMAIL_FROM
        value: "Kixima <tocemedo@gmail.com>"
      - key: BREVO_API_KEY
        sync: false
      # Alternativa por SMTP (só se o outbound SMTP estiver aberto; no Render
      # geralmente não está). Se usada, experimentar SMTP_PORT=2525.
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: LOG_LEVEL
        value: info
      # CORS (OPCIONAL): origens externas autorizadas a chamar a API, separadas
      # por vírgula. O SPA é servido na mesma origem, por isso normalmente não é
      # necessário. Em produção, sem esta lista, só a própria origem é aceite.
      - key: CORS_ORIGINS
        sync: false
      # Define no dashboard (segredo): a connection string do Supabase (pooler).
      - key: DATABASE_URL
        sync: false
      # --- Integração ERP (OPCIONAL) ---------------------------------------
      # Se definidos, o backend publica eventos de negócio no RabbitMQ para o
      # microserviço kixima-integration-service consumir. Se vazios, a
      # publicação é simplesmente ignorada (nada muda no fluxo do Kixima).
      - key: RABBITMQ_EXCHANGE
        value: kixima.events
      - key: RABBITMQ_URL
        sync: false
      - key: KIXIMA_CALLBACK_SECRET
        sync: false
      # --- Configuração ERP por empresa (Admin do Sistema) -----------------
      # ERP_CONFIG_ENCRYPTION_KEY: 32 bytes hex (cifra AES-256-GCM das credenciais).
      # INTEGRATION_URL/TOKEN: sincroniza a config com o kixima-integration-service.
      - key: ERP_CONFIG_ENCRYPTION_KEY
        sync: false
      - key: INTEGRATION_URL
        sync: false
      - key: INTEGRATION_ADMIN_TOKEN
        sync: false
      # --- AGT (e-Fatura) — assinatura JWS + Sandbox de homologação --------
      # Sem AGT_JWS_PRIVATE_KEY_BASE64 e AGT_SOFTWARE_VALIDATION_NUMBER, o
      # backend recusa-se a assinar qualquer documento AGT (ver
      # agtSigningService.js) — RECUSA-SE A FINGIR, nunca uma assinatura
      # simulada. AGT_NIF é o NIF da conta de homologação/produção, usado em
      # "Solicitar Série" (GET /api/faturacao/agt-serie-payload).
      # AGT_JWS_PRIVATE_KEY_BASE64: a chave privada RSA (PEM), em Base64 — um
      #   PEM tem quebras de linha que o painel de variáveis do Render não
      #   preserva; o Base64 evita isso. CONFIRMADO EM PRODUÇÃO: um valor deste
      #   tamanho (~2300 caracteres) pode ser cortado pelo próprio campo de
      #   variável de ambiente do Render sem aviso nenhum — nesse caso o
      #   backend deteta que não é um PEM válido e ignora-o. PREFERE em vez
      #   disto um Secret File: Service → Environment → Secret Files → "Add
      #   Secret File", nome do ficheiro "chavePrivada.pem", conteúdo = o PEM
      #   tal e qual (sem Base64). O backend lê-o automaticamente de
      #   /etc/secrets/chavePrivada.pem quando esta variável não resolver.
      - key: AGT_JWS_PRIVATE_KEY_BASE64
        sync: false
      - key: AGT_SOFTWARE_VALIDATION_NUMBER
        sync: false
      - key: AGT_SOFTWARE_ID
        sync: false
      - key: AGT_SOFTWARE_VERSION
        sync: false
      - key: AGT_NIF
        sync: false
      # AGT_ESTABLISHMENT_NUMBER: código do estabelecimento REGISTADO NA AGT
      #   para o NIF acima — não um índice inventado. Um "1" fixo no código,
      #   nunca confirmado junto da AGT, causou "E99 — O estabelecimento com
      #   o código 1 não se encontra registado para o contribuinte
      #   identificado pelo NIF ...". Confirme o código correto junto da AGT
      #   antes de o definir aqui.
      - key: AGT_ESTABLISHMENT_NUMBER
        sync: false
      - key: AGT_ENV
        sync: false
      - key: AGT_SANDBOX_USERNAME
        sync: false
      - key: AGT_SANDBOX_PASSWORD
        sync: false

  # ---------------------------------------------------------------------------
  # kixima-java — o ALVO DO CUTOVER (M8): o backend Java/Spring Boot com a
  # MESMA topologia do serviço acima (um contentor, /api + SPA na mesma origem,
  # a mesma base Supabase). Fica LADO A LADO com o serviço `kixima` (Node)
  # durante a janela de rollback: o DNS/custom domain aponta a um ou ao outro,
  # e voltar atrás é apontá-lo de volta — sem novo deploy. O serviço Node
  # acima NÃO muda enquanto a janela não fechar.
  #
  # Lê os MESMOS nomes de variável que o Node (application.yml espelha
  # config/env.js), incluindo a DATABASE_URL única (traduzida para JDBC no
  # arranque — ver DatabaseUrlEnvironmentPostProcessor). Os segredos com
  # `sync: false` definem-se no dashboard com os MESMOS valores do serviço
  # Node. O schema continua a ser do Prisma: as migrações correm no serviço
  # Node (ou à mão) — esta imagem não migra nada.
  #
  # Jobs agendados (retenção, apólices, subscrições, lembretes 2FA, robô de
  # PO, cópia de segurança) vêm DESLIGADOS por omissão em application.yml —
  # ligam-se com KIXIMA_JOB_*_ENABLED=true só quando o Node deixar de os
  # correr, para não duplicar trabalho. Isso faz parte do runbook, não deste
  # ficheiro.
  # ---------------------------------------------------------------------------
  - type: web
    name: kixima-java
    runtime: docker
    dockerfilePath: ./backend-java/Dockerfile
    # Contexto = RAIZ, como o Node: o Dockerfile precisa de frontend/ E backend-java/.
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /ready
    envVars:
      # Perfil de produção do Spring: sem valores por omissão para segredos e
      # com o guardião de arranque (ProducaoStartupGuard) ligado.
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Pool Hikari pequeno de propósito: durante a sobreposição os dois
      # backends partilham o pooler do Supabase e o Java não pode esfomear o Node.
      - key: DB_POOL_MAX
        value: "5"
      # O MESMO segredo do serviço Node, não um novo: as sessões (cookie/JWT)
      # emitidas por um continuam válidas no outro, e o cutover não desliga
      # ninguém. Um `generateValue: true` aqui criaria um segredo diferente.
      - key: JWT_SECRET
        fromService:
          type: web
          name: kixima
          envVarKey: JWT_SECRET
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: PAYMENT_SLA_DAYS
        value: "7"
      - key: POLICY_EXPIRY_ALERT_DAYS
        value: "30"
      # Email — as mesmas notas do serviço Node (Brevo por API; SMTP bloqueado no Render).
      - key: EMAIL_PROVIDER
        value: brevo
      - key: EMAIL_FROM
        value: "Kixima <tocemedo@gmail.com>"
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: CORS_ORIGINS
        sync: false
      # A MESMA connection string do serviço Node (pooler do Supabase, Session
      # mode, porta 5432, ?sslmode=require). É a única forma de configurar a
      # base aqui; DATABASE_URL_JDBC/DATABASE_USER/DATABASE_PASSWORD são a
      # alternativa explícita e nunca são precisas no Render.
      - key: DATABASE_URL
        sync: false
      # Ligação DIRETA (libpq) para o pg_dump da cópia de segurança — o mesmo
      # valor que o serviço Node usa (pooler de SESSÃO, porta 5432).
      - key: DIRECT_URL
        sync: false
      # Armazenamento S3-compatível (Supabase Storage). Em produção o Java —
      # como o env.js do Node — RECUSA-SE a arrancar sem STORAGE_PROVIDER=s3 e
      # as credenciais: o disco do contentor apaga-se a cada deploy. Copiar os
      # valores do serviço Node (estão no dashboard, não neste ficheiro).
      - key: STORAGE_PROVIDER
        value: s3
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_REGION
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_PUBLIC_URL
        sync: false
      - key: STORAGE_BACKUP_BUCKET
        sync: false
      # --- Integração ERP (OPCIONAL) — como no serviço Node ------------------
      - key: RABBITMQ_EXCHANGE
        value: kixima.events
      - key: RABBITMQ_URL
        sync: false
      - key: KIXIMA_CALLBACK_SECRET
        sync: false
      - key: ERP_CONFIG_ENCRYPTION_KEY
        sync: false
      - key: INTEGRATION_URL
        sync: false
      - key: INTEGRATION_ADMIN_TOKEN
        sync: false
      # --- AGT (e-Fatura) — as mesmas notas do serviço Node; o Secret File
      # /etc/secrets/chavePrivada.pem também é lido aqui (AgtPrivateKeyLoader).
      - key: AGT_JWS_PRIVATE_KEY_BASE64
        sync: false
      - key: AGT_SOFTWARE_VALIDATION_NUMBER
        sync: false
      - key: AGT_SOFTWARE_ID
        sync: false
      - key: AGT_SOFTWARE_VERSION
        sync: false
      - key: AGT_NIF
        sync: false
      - key: AGT_ESTABLISHMENT_NUMBER
        sync: false
      - key: AGT_ENV
        sync: false
      - key: AGT_SANDBOX_USERNAME
        sync: false
      - key: AGT_SANDBOX_PASSWORD
        sync: false
