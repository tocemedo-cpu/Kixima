# Perfil de desenvolvimento local — mesma base Postgres local usada pelos
# testes do backend Node (docker-compose.yml / tests/env.js).
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/kixima_test
    username: kixima
    password: kixima

logging:
  level:
    # Mesma variável que config/logger.js (error|warn|info|debug); em dev a omissão é debug.
    ao.kixima: ${LOG_LEVEL:DEBUG}
    org.hibernate.SQL: DEBUG
