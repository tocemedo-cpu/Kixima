# Perfil de testes JUnit — mesma base Postgres local que o backend Node usa
# em tests/env.js, para os testes portados correrem sobre dados idênticos.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/kixima_test
    username: kixima
    password: kixima
  jpa:
    hibernate:
      ddl-auto: validate

kixima:
  auth:
    jwt-secret: teste-jwt-secret-com-pelo-menos-32-caracteres-000000
  erp:
    # 32 bytes em hex — só para os testes, nunca uma chave real.
    config-encryption-key: "aab062c1f56d3cbf37c5e15cf2f33260887d9d5e6b177005142c363df9d6ea94"
  integration:
    # Só para os testes (erp-doa-approval.test.js); a falha fechada testa-se com a propriedade vazia.
    callback-secret: segredo-teste-erp-doa
