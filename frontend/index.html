    <!-- Tipos de letra (Sora / Inter / IBM Plex Mono) são self-hosted via
         @fontsource, importados em src/main.jsx — sem dependência de CDN externo. -->
    <!-- Fundo escolhido (Claro / Escuro 1 / Escuro 2) aplicado antes do primeiro
         paint, para não haver um clarão do fundo errado; sem escolha guardada o
         CSS segue o sistema (prefers-color-scheme). Ver src/tema/TemaContext.jsx. -->
    <script>
      try {
        var t = localStorage.getItem('kixima.tema');
        if (t === 'claro' || t === 'escuro-1' || t === 'escuro-2') document.documentElement.setAttribute('data-tema', t);
      } catch (e) {}
    </script>
